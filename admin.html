<body>

<script>
const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = "https://kzgqsjbayluqyhjhytkt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SUPER_ADMIN_EMAIL = "superadmin@ultraledger.app";
const EMAIL_DOMAIN = "@ultraledger.local";

function makeThrowaway() {
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false,
      storageKey: "throwaway-admin-" + Date.now() + "-" + Math.random()
    }
  });
}

const nowTime = () => {
  const d = new Date();
  return d.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
};
const todayISO = () => new Date().toISOString().slice(0, 10);
const dmy = (iso) => { if(!iso) return "-"; const p=iso.split("T")[0].split("-"); return p.length===3 ? p[2]+"-"+p[1]+"-"+p[0] : iso; };
const timeAgo = (ts) => {
  if (!ts) return "Never";
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "Just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + "d ago";
  return new Date(ts).toLocaleDateString("en-IN");
};
const daysUntil = (iso) => {
  if (!iso) return null;
  return Math.ceil((new Date(iso).getTime() - Date.now()) / (1000 * 60 * 60 * 24));
};
const downloadBlob = (blob, name) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
};

// ==================== APP ====================
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authError, setAuthError] = useState("");

  useEffect(() => {
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
        if (error || !data || data.role !== "super_admin") {
          setAuthError("Aap Super Admin nahi hain. Access denied.");
          await sb.auth.signOut();
        } else {
          setSession(session); setProfile(data);
        }
      }
      setLoading(false);
    })();

    const { data: sub } = sb.auth.onAuthStateChange(async (event, sess) => {
      if (sess) {
        const { data } = await sb.from("profiles").select("*").eq("id", sess.user.id).single();
        if (data && data.role === "super_admin") { setSession(sess); setProfile(data); }
        else { setSession(null); setProfile(null); }
      } else { setSession(null); setProfile(null); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (loading) return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
    h("div", { className: "text-center" },
      h("div", { className: "text-[44px] mb-3" }, "🔐"),
      h("div", { className: "text-[15px] font-black text-slate-600" }, "Loading...")));

  if (!session) return h(LoginScreen, { authError, setAuthError });
  return h(Dashboard, { session, profile });
}

// ==================== LOGIN ====================
function LoginScreen({ authError, setAuthError }) {
  const [email, setEmail] = useState(SUPER_ADMIN_EMAIL);
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function doLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true); setAuthError("");
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
      const { data: prof, error: pErr } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
      if (pErr || !prof || prof.role !== "super_admin") {
        await sb.auth.signOut();
        throw new Error("Ye account Super Admin nahi hai");
      }
    } catch (e) { setErr(e.message || "Login failed"); } finally { setBusy(false); }
  }

  return h("div", { className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-100 to-pink-100 p-4" },
    h("div", { className: "w-full max-w-md" },
      h("div", { className: "text-center mb-6" },
        h("div", { className: "text-[56px] mb-2" }, "🔐"),
        h("div", { className: "text-[24px] font-black tracking-tight text-purple-900" }, "SUPER ADMIN"),
        h("div", { className: "text-[11px] font-bold text-purple-600 tracking-widest uppercase mt-1" }, "Ultra Ledger Owner Panel")),
      h("form", { onSubmit: doLogin, className: "bg-white rounded-2xl shadow-xl border border-purple-200 p-7" },
        h("div", { className: "space-y-4" },
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Email"),
            h("input", { type: "email", value: email, onChange: e => setEmail(e.target.value),
              className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500",
              placeholder: "superadmin@ultraledger.app" })),
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Password"),
            h("input", { type: "password", value: password, onChange: e => setPassword(e.target.value), autoFocus: true,
              className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500",
              placeholder: "••••••••" }))),
        (err || authError) && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + (err || authError)),
        h("button", { type: "submit", disabled: busy,
          className: "mt-5 w-full h-12 rounded-xl bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-black text-[14px] tracking-wide" },
          busy ? "..." : "LOGIN"))));
}

// ==================== DASHBOARD ====================
function Dashboard({ session, profile }) {
  const [companies, setCompanies] = useState([]);
  const [userCounts, setUserCounts] = useState({});
  const [usersData, setUsersData] = useState([]);
  const [notices, setNotices] = useState([]);
  const [payments, setPayments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedCompany, setSelectedCompany] = useState(null);
  const [showAddCompany, setShowAddCompany] = useState(false);
  const [editCompany, setEditCompany] = useState(null);
  const [showBroadcast, setShowBroadcast] = useState(false);
  const [showAnalytics, setShowAnalytics] = useState(false);
  const [showDeleted, setShowDeleted] = useState(false);
  const [toast, setToast] = useState(null);
  const [pin, setPin] = useState("");
  const [pinSet, setPinSet] = useState(false);
  const [showPinSetup, setShowPinSetup] = useState(false);
  const [pinInput, setPinInput] = useState("");

  useEffect(() => {
    const savedPin = localStorage.getItem("admin_pin");
    if (savedPin) { setPin(savedPin); setPinSet(true); }
    else setShowPinSetup(true);
  }, []);

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); } }, [toast]);

  async function load() {
    setLoading(true);
    // Companies (all, including deleted)
    const { data: comps } = await sb.from("companies").select("*").order("created_at", { ascending: false });
    setCompanies(comps || []);

    // Profiles
    const { data: profs } = await sb.from("profiles").select("*").not("company_id", "is", null);
    setUsersData(profs || []);
    const counts = {};
    (profs || []).forEach(p => { counts[p.company_id] = (counts[p.company_id] || 0) + 1; });
    setUserCounts(counts);

    // Notices
    const { data: ntcs } = await sb.from("broadcast_notices").select("*").order("created_at", { ascending: false });
    setNotices(ntcs || []);

    // Payments
    const { data: pays } = await sb.from("payments").select("*").order("paid_at", { ascending: false });
    setPayments(pays || []);

    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  async function logout() { await sb.auth.signOut(); }

  function savePin() {
    if (pinInput.length < 4) { setToast("PIN min 4 digits"); return; }
    localStorage.setItem("admin_pin", pinInput);
    setPin(pinInput);
    setPinSet(true);
    setShowPinSetup(false);
    setPinInput("");
    setToast("PIN set successfully ✓");
  }

  // Stats
  const activeCompanies = companies.filter(c => c.active && !c.deleted_at).length;
  const deletedCompanies = companies.filter(c => c.deleted_at).length;
  const totalUsers = usersData.length;
  const activeUsers = usersData.filter(u => u.active !== false).length;
  const totalRevenue = payments.reduce((a, p) => a + Number(p.amount || 0), 0);
  const expiringSoon = companies.filter(c => {
    if (!c.expiry_date || c.deleted_at) return false;
    const d = daysUntil(c.expiry_date);
    return d !== null && d >= 0 && d <= 30;
  });

  return h("div", { className: "min-h-screen bg-slate-100 flex flex-col" },
    // Header
    h("header", { className: "bg-gradient-to-r from-purple-700 to-pink-700 text-white shadow-md sticky top-0 z-30" },
      h("div", { className: "px-6 h-16 flex items-center justify-between flex-wrap gap-2" },
        h("div", { className: "flex items-center gap-3" },
          h("div", { className: "text-[28px]" }, "🔐"),
          h("div", null,
            h("div", { className: "text-[16px] font-black tracking-tight" }, "SUPER ADMIN"),
            h("div", { className: "text-[10px] font-bold opacity-80 uppercase tracking-widest" }, "Ultra Ledger Owner Panel"))),
        h("div", { className: "flex items-center gap-2 flex-wrap" },
          h("button", { onClick: () => setShowAnalytics(true),
            className: "h-9 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "📊 Analytics"),
          h("button", { onClick: () => setShowBroadcast(true),
            className: "h-9 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "📢 Broadcast"),
          h("button", { onClick: () => setShowDeleted(v => !v),
            className: "h-9 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, showDeleted ? "👁️ Active Only" : `🗑️ Deleted (${deletedCompanies})`),
          pinSet && h("button", { onClick: () => setShowPinSetup(true),
            className: "h-9 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "🔑 PIN"),
          h("button", { onClick: logout,
            className: "h-9 px-4 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "Logout")))),

    h("main", { className: "flex-1 p-6 max-w-7xl w-full mx-auto" },

      // Expiring soon alert
      expiringSoon.length > 0 && h("div", { className: "mb-4 p-4 rounded-2xl bg-amber-50 border-2 border-amber-300" },
        h("div", { className: "flex items-center gap-3" },
          h("span", { className: "text-[24px]" }, "⚠️"),
          h("div", { className: "flex-1" },
            h("div", { className: "text-[14px] font-black text-amber-900" }, expiringSoon.length + " compan" + (expiringSoon.length === 1 ? "y" : "ies") + " expiring soon!"),
            h("div", { className: "text-[12px] font-bold text-amber-700 mt-0.5" },
              expiringSoon.map(c => c.name + " (" + daysUntil(c.expiry_date) + "d)").join(" • "))))),

      // Stats grid
      h("div", { className: "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-6" },
        h(StatCard, { label: "Total Companies", value: companies.length, color: "purple", icon: "🏢" }),
        h(StatCard, { label: "Active", value: activeCompanies, color: "green", icon: "✅" }),
        h(StatCard, { label: "Total Users", value: totalUsers, color: "pink", icon: "👥" }),
        h(StatCard, { label: "Active Users", value: activeUsers, color: "cyan", icon: "🟢" }),
        h(StatCard, { label: "Revenue", value: "₹" + totalRevenue.toLocaleString("en-IN"), color: "emerald", icon: "💰" }),
        h(StatCard, { label: "Deleted", value: deletedCompanies, color: "red", icon: "🗑️" })),

      // Companies header
      h("div", { className: "flex items-center justify-between mb-4" },
        h("h2", { className: "text-[18px] font-black text-slate-800" },
          showDeleted ? "🗑️ Deleted Companies (Recoverable)" : "Companies"),
        !showDeleted && h("button", { onClick: () => setShowAddCompany(true),
          className: "h-10 px-5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-[13px]" },
          "+ Add Company")),

      // List
      loading ? h("div", { className: "text-center py-10 text-slate-500 font-bold" }, "Loading...") :
      companies.length === 0 ? h("div", { className: "bg-white rounded-2xl border border-slate-200 py-16 text-center" },
        h("div", { className: "text-[48px] mb-3" }, "🏢"),
        h("div", { className: "text-[15px] font-black text-slate-700" }, "Koi company nahi hai"),
        h("div", { className: "text-[12px] font-bold text-slate-500 mt-1" }, "+ Add Company dabao")) :
      h("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
        companies
          .filter(c => showDeleted ? c.deleted_at : !c.deleted_at)
          .map(c => h(CompanyCard, {
            key: c.id, company: c,
            userCount: userCounts[c.id] || 0,
            companyUsers: usersData.filter(u => u.company_id === c.id),
            companyPayments: payments.filter(p => p.company_id === c.id),
            pin, onRefresh: load, setToast,
            onOpen: () => setSelectedCompany(c),
            onEdit: () => setEditCompany(c),
            isDeleted: !!c.deleted_at
          }))),

    // Modals
    showAddCompany && h(AddCompanyModal, { onClose: () => setShowAddCompany(false), onCreated: () => { load(); setToast("Company created ✓"); } }),
    editCompany && h(EditCompanyModal, { company: editCompany, pin, onClose: () => setEditCompany(null), onUpdated: () => { load(); setToast("Company updated ✓"); } }),
    selectedCompany && h(CompanyDetailModal, {
      company: selectedCompany, pin, session,
      onClose: () => setSelectedCompany(null),
      onRefresh: load,
      setToast
    }),
    showBroadcast && h(BroadcastModal, { notices, onClose: () => setShowBroadcast(false), onRefresh: load, setToast }),
    showAnalytics && h(AnalyticsModal, { companies, users: usersData, payments, notices, onClose: () => setShowAnalytics(false) }),
    showPinSetup && h(PinSetupModal, { pinInput, setPinInput, savePin, onClose: () => pinSet && setShowPinSetup(false), isFirst: !pinSet }),

    toast && h("div", { className: "fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-full bg-black text-white text-[13px] font-black shadow-2xl" }, "✓ " + toast)
  );
}

// ==================== STAT CARD ====================
function StatCard({ label, value, color, icon }) {
  const colors = {
    purple: "text-purple-700", green: "text-green-600", pink: "text-pink-600",
    cyan: "text-cyan-600", emerald: "text-emerald-600", red: "text-red-600"
  };
  return h("div", { className: "bg-white rounded-2xl border border-slate-200 p-4 shadow-sm" },
    h("div", { className: "flex items-center justify-between mb-1" },
      h("div", { className: "text-[10px] font-black text-slate-500 uppercase tracking-widest" }, label),
      h("span", { className: "text-[16px]" }, icon)),
    h("div", { className: "text-[22px] font-black " + (colors[color] || "text-slate-800") }, value));
}

// ==================== COMPANY CARD ====================
function CompanyCard({ company, userCount, companyUsers, companyPayments, pin, onRefresh, onOpen, onEdit, setToast, isDeleted }) {
  const [busy, setBusy] = useState(false);
  const expiryDays = daysUntil(company.expiry_date);
  const isExpired = expiryDays !== null && expiryDays < 0;
  const totalPaid = companyPayments.reduce((a, p) => a + Number(p.amount || 0), 0);
  const adminCount = companyUsers.filter(u => u.role === "admin").length;

  async function deleteCompany() {
    if (userCount > 0) {
      if (!confirm(`⚠️ Is company me ${userCount} users hain!\n\nContinue?`)) return;
    }
    if (!confirm(`⚠️ SOFT DELETE COMPANY\n\nCompany: ${company.name}\nCode: ${company.code}\n\n📥 Pehle AUTO-BACKUP download hoga.\n🗑️ Company 30 din tak recover ho sakti hai.`)) return;
    const typed = prompt(`Type company code to confirm:\n\n${company.code}`);
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== company.code.toUpperCase()) { alert("❌ Code mismatch. Cancelled."); return; }
    const enteredPin = prompt("🔐 Enter your admin PIN:");
    if (enteredPin !== pin) { alert("❌ Wrong PIN. Cancelled."); return; }

    setBusy(true);
    try {
      // 1. Auto-backup: state + profiles + payments
      const { data: state } = await sb.from("company_state").select("state").eq("company_id", company.id).maybeSingle();
      const backup = {
        company, users: companyUsers, payments: companyPayments,
        state: state?.state || null,
        exportedAt: new Date().toISOString(),
        reason: "Soft delete by super admin"
      };
      downloadBlob(new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }),
        "auto-backup_" + company.code + "_" + todayISO() + ".json");

      // 2. Save to deleted_backups table
      await sb.from("deleted_backups").insert({
        company_id: company.id,
        company_name: company.name,
        company_code: company.code,
        deleted_by: "super_admin",
        backup_json: backup,
        reason: "Soft deleted from admin panel"
      });

      // 3. Soft delete
      const { error } = await sb.from("companies").update({
        deleted_at: new Date().toISOString(),
        active: false
      }).eq("id", company.id);

      if (error) throw error;
      setToast("Company soft-deleted ✓ (Recoverable)");
      onRefresh();
    } catch (e) {
      alert("Error: " + e.message);
    } finally { setBusy(false); }
  }

  async function restoreCompany() {
    if (!confirm(`♻️ RESTORE COMPANY\n\nCompany: ${company.name}\n\nYe company aur uske saare users active ho jayenge.\nContinue?`)) return;
    const enteredPin = prompt("🔐 Enter admin PIN:");
    if (enteredPin !== pin) { alert("❌ Wrong PIN"); return; }

    setBusy(true);
    try {
      const { error } = await sb.from("companies").update({
        deleted_at: null,
        active: true
      }).eq("id", company.id);
      if (error) throw error;
      setToast("Company restored ✓");
      onRefresh();
    } catch (e) { alert("Error: " + e.message); }
    finally { setBusy(false); }
  }

  async function toggleActive() {
    const nextState = !company.active;
    if (!confirm(`${nextState ? "✅ ACTIVATE" : "🚫 DEACTIVATE"} COMPANY\n\n${company.name}\n\n${nextState ? "Users login kar payenge." : "Users login NAHI kar payenge. Data safe rahega."}`)) return;
    const enteredPin = prompt("🔐 Enter admin PIN:");
    if (enteredPin !== pin) { alert("❌ Wrong PIN"); return; }

    setBusy(true);
    try {
      const { error } = await sb.from("companies").update({ active: nextState }).eq("id", company.id);
      if (error) throw error;
      setToast("Company " + (nextState ? "activated" : "deactivated") + " ✓");
      onRefresh();
    } catch (e) { alert("Error: " + e.message); }
    finally { setBusy(false); }
  }

  // Deleted card
  if (isDeleted) {
    return h("div", { className: "bg-red-50 rounded-2xl border-2 border-dashed border-red-300 overflow-hidden" },
      h("div", { className: "p-5" },
        h("div", { className: "flex items-start justify-between mb-3" },
          h("div", { className: "flex items-center gap-3" },
            h("div", { className: "w-12 h-12 rounded-xl bg-red-200 border border-red-300 flex items-center justify-center text-[20px] font-black text-red-800" },
              company.name[0]?.toUpperCase() || "?"),
            h("div", null,
              h("div", { className: "text-[15px] font-black text-slate-800" }, company.name),
              h("div", { className: "text-[11px] font-bold text-red-700 font-mono" }, "Code: " + company.code))),
          h("span", { className: "px-2.5 py-1 rounded-full text-[10px] font-black border bg-red-100 text-red-700 border-red-300" }, "DELETED")),
        h("div", { className: "text-[11px] font-bold text-red-700 mb-3" }, "🗑️ Deleted: " + timeAgo(company.deleted_at)),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: restoreCompany, disabled: busy,
            className: "flex-1 h-10 rounded-xl bg-green-600 hover:bg-green-700 text-white font-black text-[12px] disabled:opacity-50" },
            busy ? "..." : "♻️ Restore Company"))));
  }

  // Active card
  return h("div", { className: "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition" },
    h("div", { className: "p-5" },
      h("div", { className: "flex items-start justify-between mb-4" },
        h("div", { className: "flex items-center gap-3" },
          h("div", { className: "w-12 h-12 rounded-xl bg-purple-100 border border-purple-200 flex items-center justify-center text-[20px] font-black text-purple-700" },
            company.name[0]?.toUpperCase() || "?"),
          h("div", null,
            h("div", { className: "text-[15px] font-black text-slate-800 flex items-center gap-2" },
              company.name,
              adminCount > 0 && h("span", { className: "text-[9px] px-1.5 py-0.5 rounded-full bg-purple-200 text-purple-800 border border-purple-300 font-black" }, "⭐ " + adminCount)),
            h("div", { className: "text-[11px] font-bold text-slate-500 font-mono" }, "Code: " + company.code))),
        h("div", { className: "flex flex-col items-end gap-1" },
          h("span", { className: "px-2.5 py-1 rounded-full text-[10px] font-black border " +

// ==================== ADD USER ====================
function AddUserModal({ company, users, onClose, onCreated }) {
  const [username, setUsername] = useState("");
  const [fullName, setFullName] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  // First user = admin
  const isFirstUser = users.length === 0;
  const assignedRole = isFirstUser ? "admin" : "user";

  function suggestPwd() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
    setPassword((username || "user") + "@" + r);
  }

  async function create() {
    if (!username.trim()) return setErr("Username required");
    if (password.length < 6) return setErr("Password min 6 chars");
    const uname = username.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
    if (!uname) return setErr("Username invalid");
    if (users.some(u => u.username === uname)) return setErr("Username already exists");
    if (users.length >= company.max_users) return setErr("Max users reached");

    setBusy(true); setErr("");
    try {
      const email = uname + "." + company.code.toLowerCase() + EMAIL_DOMAIN;
      const t = makeThrowaway();
      let userId = null;

      const { data: authData, error: authErr } = await t.auth.signUp({
        email, password,
        options: { data: { username: uname, full_name: fullName.trim() || uname, company_id: company.id, role: assignedRole } }
      });

      if (authErr) {
        if (authErr.message.toLowerCase().includes("already") || authErr.message.toLowerCase().includes("registered")) {
          const { data: signInData, error: signInErr } = await t.auth.signInWithPassword({ email, password });
          if (signInErr) throw new Error("Ye email Supabase Auth me pehle se hai. Dashboard me jaake '" + email + "' delete karo.");
          userId = signInData.user.id;
        } else throw authErr;
      } else if (authData && authData.user) {
        userId = authData.user.id;
      } else throw new Error("User not created in Auth");

      const { error: pErr } = await sb.from("profiles").upsert({
        id: userId,
        username: uname,
        company_id: company.id,
        role: assignedRole,
        full_name: fullName.trim() || uname,
        active: true
      }, { onConflict: "id" });
      if (pErr) throw new Error("Profile error: " + pErr.message);

      try { await t.auth.signOut(); } catch (e) {}

      onCreated({ username: uname, password, fullName: fullName.trim() || uname, company: company.name, email, role: assignedRole });
      onClose();
    } catch (e) {
      setErr(e.message || "Failed to create user");
    } finally { setBusy(false); }
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null,
          h("div", { className: "text-[16px] font-black text-slate-800" }, "Add User"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-0.5" }, company.name + " • " + users.length + "/" + company.max_users)),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold" }, "✕")),
      isFirstUser && h("div", { className: "mb-4 p-3 rounded-lg bg-purple-50 border border-purple-300" },
        h("div", { className: "text-[12px] font-black text-purple-900" }, "⭐ Ye company ka FIRST user hai!"),
        h("div", { className: "text-[11px] font-bold text-purple-700 mt-0.5" }, "Ye automatically ADMIN banega. Iske paas Backup/Restore ka access hoga.")),
      h("div", { className: "space-y-4" },
        h(Field, { label: "Username", value: username, onChange: v => setUsername(v.toLowerCase().replace(/[^a-z0-9_]/g, "")), placeholder: "e.g. rajesh", mono: true }),
        h(Field, { label: "Full Name (optional)", value: fullName, onChange: setFullName, placeholder: "e.g. Rajesh Kumar" }),
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Password"),
          h("div", { className: "flex gap-2" },

// ==================== EDIT USER ====================
function EditUserModal({ user, pin, onClose, onUpdated }) {
  const [newPwd, setNewPwd] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  function suggestPwd() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
    setNewPwd(user.username + "@" + r);
  }

  async function reset() {
    if (newPwd.length < 6) return setErr("Password min 6 chars");
    const enteredPin = prompt("🔐 Enter admin PIN:");
    if (enteredPin !== pin) { setErr("Wrong PIN"); return; }

    setBusy(true); setErr("");
    try {
      const { data, error } = await sb.rpc("admin_reset_password", {
        target_user_id: user.id,
        new_password: newPwd
      });
      if (error) throw error;
      if (!data) throw new Error("Reset failed");
      onUpdated(newPwd);
    } catch (e) { setErr(e.message || "Reset failed"); }
    finally { setBusy(false); }
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null,
          h("div", { className: "text-[16px] font-black text-slate-800" }, "Reset Password"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-0.5" }, "@" + user.username)),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold" }, "✕")),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "New Password"),
        h("div", { className: "flex gap-2" },
          h("input", { value: newPwd, autoFocus: true, onChange: e => setNewPwd(e.target.value),
            className: "flex-1 h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold font-mono outline-none focus:border-purple-500" }),
          h("button", { type: "button", onClick: suggestPwd,
            className: "h-12 px-4 rounded-xl border border-purple-300 bg-purple-50 text-purple-700 font-black text-[11px]" }, "🎲 Auto"))),
      err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
      h("div", { className: "flex gap-3 mt-6" },
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px] text-slate-700" }, "Cancel"),
        h("button", { onClick: reset, disabled: busy, className: "flex-1 h-11 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-[13px] disabled:opacity-50" },
          busy ? "..." : "Reset Password"))));
}

// ==================== PAYMENT MODAL ====================
function PaymentModal({ company, onClose, onSaved }) {
  const [amount, setAmount] = useState("");
  const [paidAt, setPaidAt] = useState(todayISO());
  const [paidTill, setPaidTill] = useState("");
  const [invoiceNo, setInvoiceNo] = useState("");
  const [notes, setNotes] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function save() {
    if (!amount || isNaN(amount) || Number(amount) <= 0) return setErr("Valid amount required");
    setBusy(true); setErr("");
    const { error } = await sb.from("payments").insert({
      company_id: company.id,
      amount: Number(amount),
      paid_at: paidAt,
      paid_till: paidTill || null,
      invoice_no: invoiceNo.trim() || null,
      notes: notes.trim() || null
    });
    setBusy(false);
    if (error) return setErr(error.message);
    onSaved(); onClose();
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 max-h-[90vh] overflow-auto", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null,
          h("div", { className: "text-[16px] font-black text-slate-800" }, "💰 Record Payment"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-0.5" }, company.name)),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold" }, "✕")),
      h("div", { className: "space-y-4" },
        h(Field, { label: "Amount (₹)", type: "number", value: amount, onChange: setAmount, placeholder: "e.g. 5000" }),
        h(Field, { label: "Paid On", type: "date", value: paidAt, onChange: setPaidAt }),
        h(Field, { label: "Valid Till (optional)", type: "date", value: paidTill, onChange: setPaidTill, hint: "Is date tak subscription valid" }),
        h(Field, { label: "Invoice No (optional)", value: invoiceNo, onChange: setInvoiceNo, placeholder: "INV-001", mono: true }),
        h(Field, { label: "Notes (optional)", value: notes, onChange: setNotes, placeholder: "Any remarks..." })),
      err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
      h("div", { className: "flex gap-3 mt-6" },
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px] text-slate-700" }, "Cancel"),
        h("button", { onClick: save, disabled: busy, className: "flex-1 h-11 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-[13px] disabled:opacity-50" },
          busy ? "..." : "💾 Save Payment"))));
}

// ==================== BROADCAST ====================
function BroadcastModal({ notices, onClose, onRefresh, setToast }) {
  const [message, setMessage] = useState("");
  const [busy, setBusy] = useState(false);

  async function send() {
    if (!message.trim()) return;
    setBusy(true);
    const { error } = await sb.from("broadcast_notices").insert({ message: message.trim(), active: true });
    setBusy(false);
    if (error) { alert("Error: " + error.message); return; }
    setMessage(""); onRefresh(); setToast("Notice broadcast ✓");
  }

  async function toggle(n) {
    const { error } = await sb.from("broadcast_notices").update({ active: !n.active }).eq("id", n.id);
    if (error) { alert("Error: " + error.message); return; }
    onRefresh();
  }

  async function remove(n) {
    if (!confirm("Delete this notice?")) return;
    const { error } = await sb.from("broadcast_notices").delete().eq("id", n.id);
    if (error) { alert("Error: " + error.message); return; }
    onRefresh();
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-2xl bg-white rounded-2xl shadow-2xl max-h-[90vh] flex flex-col", onClick: e => e.stopPropagation() },
      h("div", { className: "px-6 py-4 border-b border-slate-200 flex items-center justify-between" },
        h("div", null,
          h("div", { className: "text-[17px] font-black text-slate-800" }, "📢 Broadcast Notice"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-0.5" }, "Sabhi companies ko dikhega login ke baad")),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold" }, "✕")),
      h("div", { className: "p-6 border-b border-slate-200" },
        h("textarea", { value: message, onChange: e => setMessage(e.target.value), rows: 3,
          placeholder: "e.g. Server maintenance on 20-Sep, 2 AM to 4 AM. Please complete urgent entries before.",
          className: "w-full rounded-xl border border-slate-300 px-4 py-3 text-[13px] font-bold outline-none focus:border-purple-500" }),
        h("button", { onClick: send, disabled: busy || !message.trim(),
          className: "mt-3 h-10 px-5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-[13px] disabled:opacity-50" },
          busy ? "..." : "📢 Send Broadcast")),
      h("div", { className: "flex-1 overflow-auto p-6" },
        h("div", { className: "text-[13px] font-black text-slate-700 mb-3" }, "📋 Notice History"),
        notices.length === 0 ? h("div", { className: "text-center py-8 text-slate-500 font-bold text-[13px]" }, "Koi notice nahi") :
        h("div", { className: "space-y-2" },
          notices.map(n => h("div", { key: n.id,
            className: "p-3 rounded-lg border " + (n.active ? "bg-purple-50 border-purple-200" : "bg-slate-50 border-slate-200 opacity-60") },
            h("div", { className: "flex items-start justify-between gap-2" },
              h("div", { className: "flex-1" },
                h("div", { className: "text-[13px] font-bold text-slate-800 whitespace-pre-wrap" }, n.message),
                h("div", { className: "text-[10px] font-bold text-slate-500 mt-1" }, timeAgo(n.created_at))),
              h("div", { className: "flex gap-1" },
                h("button", { onClick: () => toggle(n),
                  className: "h-7 px-2 rounded text-[10px] font-black border " + (n.active ? "bg-green-50 text-green-700 border-green-200" : "bg-gray-50 text-gray-600 border-gray-200") },
                  n.active ? "ON" : "OFF"),
                h("button", { onClick: () => remove(n),
                  className: "h-7 px-2 rounded text-[10px] font-black border border-red-300 text-red-600 bg-white" }, "🗑️"))))))));
}

// ==================== ANALYTICS ====================
function AnalyticsModal({ companies, users, payments, notices, onClose }) {
  const active = companies.filter(c => c.active && !c.deleted_at);
  const deleted = companies.filter(c => c.deleted_at);
  const activeUsers = users.filter(u => u.active !== false && !u.deleted_at);
  const totalRevenue = payments.reduce((a, p) => a + Number(p.amount || 0), 0);

  // Revenue last 6 months
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    const label = d.toLocaleString("en-IN", { month: "short", year: "2-digit" });
    const total = payments.filter(p => (p.paid_at || "").startsWith(key)).reduce((a, p) => a + Number(p.amount || 0), 0);
    months.push({ label, total });
  }
  const maxRev = Math.max(...months.map(m => m.total), 1);

  // Company-wise users
  const topCompanies = active.slice().sort((a, b) => {
    const ca = users.filter(u => u.company_id === a.id && u.active !== false).length;
    const cb = users.filter(u => u.company_id === b.id && u.active !== false).length;
    return cb - ca;
  }).slice(0, 5);

  // Total entries estimate
  const totalUsersCount = users.length;

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-4xl bg-white rounded-2xl shadow-2xl max-h-[92vh] flex flex-col", onClick: e => e.stopPropagation() },
      h("div", { className: "px-6 py-4 border-b border-slate-200 flex items-center justify-between" },
        h("div", null,
          h("div", { className: "text-[17px] font-black text-slate-800" }, "📊 Analytics Dashboard"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-0.5" }, "Complete overview")),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold" }, "✕")),
      h("div", { className: "flex-1 overflow-auto p-6 space-y-6" },

        // Overview
        h("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-3" },
          h(StatCard, { label: "Active Companies", value: active.length, color: "green", icon: "🏢" }),
          h(StatCard, { label: "Deleted", value: deleted.length, color: "red", icon: "🗑️" }),
          h(StatCard, { label: "Total Users", value: totalUsersCount, color: "pink", icon: "👥" }),
          h(StatCard, { label: "Total Revenue", value: "₹" + totalRevenue.toLocaleString("en-IN"), color: "emerald", icon: "💰" })),

        // Revenue chart
        h("div", { className: "p-5 rounded-2xl border border-slate-200" },
          h("div", { className: "text-[14px] font-black text-slate-800 mb-4" }, "📈 Revenue — Last 6 Months"),
          h("div", { className: "flex items-end gap-3 h-40" },
            months.map((m, i) => h("div", { key: i, className: "flex-1 flex flex-col items-center gap-2" },
              h("div", { className: "text-[10px] font-black text-emerald-700" }, "₹" + m.total.toLocaleString("en-IN")),
              h("div", { className: "w-full bg-gradient-to-t from-emerald-500 to-emerald-300 rounded-t-lg transition-all",
                style: { height: Math.max(4, (m.total / maxRev) * 120) + "px" } }),
              h("div", { className: "text-[10px] font-black text-slate-600" }, m.label))))),

        // Top companies
        h("div", { className: "p-5 rounded-2xl border border-slate-200" },
          h("div", { className: "text-[14px] font-black text-slate-800 mb-4" }, "🏆 Top Companies by Users"),
          topCompanies.length === 0 ? h("div", { className: "text-center py-4 text-slate-500 font-bold text-[12px]" }, "No data") :
          h("div", { className: "space-y-2" },
            topCompanies.map(c => {
              const count = users.filter(u => u.company_id === c.id && u.active !== false).length;
              const pct = (count / c.max_users) * 100;
              return h("div", { key: c.id, className: "flex items-center gap-3" },
                h("div", { className: "w-32 text-[12px] font-black text-slate-700 truncate" }, c.name),
                h("div", { className: "flex-1 h-6 rounded-full bg-slate-100 overflow-hidden" },
                  h("div", { className: "h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-end pr-2",
                    style: { width: Math.max(8, pct) + "%" } },
                    h("span", { className: "text-[10px] font-black text-white" }, count + "/" + c.max_users))))),

        // Storage/Usage
        h("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-3" },
          h(StatCard, { label: "Broadcasts", value: notices.length, color: "purple", icon: "📢" }),
          h(StatCard, { label: "Payments Log", value: payments.length, color: "emerald", icon: "💳" }),
          h(StatCard, { label: "Active Users", value: activeUsers.length, color: "cyan", icon: "✅" }),
          h(StatCard, { label: "Deactivated", value: totalUsersCount - activeUsers.length, color: "red", icon: "🚫" })))));
}
