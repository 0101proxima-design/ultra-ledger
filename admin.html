<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA LEDGER — SUPER ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>body{margin:0;padding:0;font-family:Inter,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = "https://kzgqsjbayluqyhjhytkt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SUPER_ADMIN_EMAIL = "superadmin@ultraledger.app";
const EMAIL_DOMAIN = "@ultraledger.local";

function makeThrowaway() {
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "throwaway-" + Date.now() + "-" + Math.random() }
  });
}

const nowTime = () => new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authError, setAuthError] = useState("");

  useEffect(() => {
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
        if (error || !data || data.role !== "super_admin") {
          setAuthError("Aap Super Admin nahi hain");
          await sb.auth.signOut();
        } else {
          setSession(session); setProfile(data);
        }
      }
      setLoading(false);
    })();
    const { data: sub } = sb.auth.onAuthStateChange(async (event, sess) => {
      if (sess) {
        const { data } = await sb.from("profiles").select("*").eq("id", sess.user.id).single();
        if (data && data.role === "super_admin") { setSession(sess); setProfile(data); }
        else { setSession(null); setProfile(null); }
      } else { setSession(null); setProfile(null); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (loading) return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
    h("div", { className: "text-center" }, h("div", { className: "text-[44px] mb-3" }, "🔐"), h("div", { className: "text-[15px] font-black text-slate-600" }, "Loading...")));

  if (!session) return h(LoginScreen, { authError, setAuthError });
  return h(Dashboard, { session, profile });
}

function LoginScreen({ authError, setAuthError }) {
  const [email, setEmail] = useState(SUPER_ADMIN_EMAIL);
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function doLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true); setAuthError("");
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
      const { data: prof, error: pErr } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
      if (pErr || !prof || prof.role !== "super_admin") {
        await sb.auth.signOut();
        throw new Error("Ye account Super Admin nahi hai");
      }
    } catch (e) { setErr(e.message || "Login failed"); }
    finally { setBusy(false); }
  }

  return h("div", { className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-100 to-pink-100 p-4" },
    h("div", { className: "w-full max-w-md" },
      h("div", { className: "text-center mb-6" },
        h("div", { className: "text-[56px] mb-2" }, "🔐"),
        h("div", { className: "text-[24px] font-black tracking-tight text-purple-900" }, "SUPER ADMIN"),
        h("div", { className: "text-[11px] font-bold text-purple-600 tracking-widest uppercase mt-1" }, "Ultra Ledger Owner Panel")),
      h("form", { onSubmit: doLogin, className: "bg-white rounded-2xl shadow-xl border border-purple-200 p-7" },
        h("div", { className: "space-y-4" },
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Email"),
            h("input", { type: "email", value: email, onChange: e => setEmail(e.target.value), className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500" })),
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Password"),
            h("input", { type: "password", value: password, onChange: e => setPassword(e.target.value), autoFocus: true, className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500" }))),
        (err || authError) && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + (err || authError)),
        h("button", { type: "submit", disabled: busy, className: "mt-5 w-full h-12 rounded-xl bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-black text-[14px] tracking-wide" }, busy ? "..." : "LOGIN"))));
}

function Dashboard({ session, profile }) {
  const [companies, setCompanies] = useState([]);
  const [userCounts, setUserCounts] = useState({});
  const [loading, setLoading] = useState(true);
  const [selectedCompany, setSelectedCompany] = useState(null);
  const [showAddCompany, setShowAddCompany] = useState(false);
  const [toast, setToast] = useState(null);
  const [pin, setPin] = useState("");
  const [pinSet, setPinSet] = useState(false);
  const [showPinSetup, setShowPinSetup] = useState(false);
  const [pinInput, setPinInput] = useState("");

  useEffect(() => {
    const savedPin = localStorage.getItem("admin_pin");
    if (savedPin) { setPin(savedPin); setPinSet(true); }
    else setShowPinSetup(true);
  }, []);

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 3000); return () => clearTimeout(t); } }, [toast]);

  async function load() {
    setLoading(true);
    const { data: comps, error } = await sb.from("companies").select("*").order("created_at", { ascending: false });
    if (!error) {
      setCompanies(comps || []);
      const { data: profs } = await sb.from("profiles").select("company_id").not("company_id", "is", null);
      const counts = {};
      (profs || []).forEach(p => { counts[p.company_id] = (counts[p.company_id] || 0) + 1; });
      setUserCounts(counts);
    }
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function savePin() {
    if (pinInput.length < 4) { setToast("PIN min 4 digits"); return; }
    localStorage.setItem("admin_pin", pinInput);
    setPin(pinInput); setPinSet(true); setShowPinSetup(false); setPinInput("");
    setToast("PIN set ✓");
  }

  return h("div", { className: "min-h-screen bg-slate-100 flex flex-col" },
    h("header", { className: "bg-gradient-to-r from-purple-700 to-pink-700 text-white shadow-md sticky top-0 z-30" },
      h("div", { className: "px-6 h-16 flex items-center justify-between" },
        h("div", { className: "flex items-center gap-3" },
          h("div", { className: "text-[28px]" }, "🔐"),
          h("div", null,
            h("div", { className: "text-[16px] font-black tracking-tight" }, "SUPER ADMIN"),
            h("div", { className: "text-[10px] font-bold opacity-80 uppercase tracking-widest" }, "Ultra Ledger Owner Panel"))),
        h("div", { className: "flex items-center gap-3" },
          pinSet && h("button", { onClick: () => setShowPinSetup(true), className: "h-9 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "🔑 PIN"),
          h("button", { onClick: () => sb.auth.signOut(), className: "h-9 px-4 rounded-lg bg-white/10 hover:bg-white/20 text-[12px] font-black" }, "Logout")))),
    h("main", { className: "flex-1 p-6 max-w-7xl w-full mx-auto" },
      h("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" },
        h("div", { className: "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm" },
          h("div", { className: "text-[11px] font-black text-slate-500 uppercase tracking-widest" }, "Total Companies"),
          h("div", { className: "text-[30px] font-black text-purple-700 mt-1" }, companies.length)),
        h("div", { className: "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm" },
          h("div", { className: "text-[11px] font-black text-slate-500 uppercase tracking-widest" }, "Total Users"),
          h("div", { className: "text-[30px] font-black text-pink-600 mt-1" }, Object.values(userCounts).reduce((a, b) => a + b, 0))),
        h("div", { className: "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm" },
          h("div", { className: "text-[11px] font-black text-slate-500 uppercase tracking-widest" }, "Active Companies"),
          h("div", { className: "text-[30px] font-black text-green-600 mt-1" }, companies.filter(c => c.active).length))),
      h("div", { className: "flex items-center justify-between mb-4" },
        h("h2", { className: "text-[18px] font-black text-slate-800" }, "Companies"),
        h("button", { onClick: () => setShowAddCompany(true), className: "h-10 px-5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-[13px]" }, "+ Add Company")),
      loading ? h("div", { className: "text-center py-10 text-slate-500 font-bold" }, "Loading...") :
      companies.length === 0 ? h("div", { className: "bg-white rounded-2xl border border-slate-200 py-16 text-center" },
        h("div", { className: "text-[48px] mb-3" }, "🏢"),
        h("div", { className: "text-[15px] font-black text-slate-700" }, "Koi company nahi hai"),
        h("div", { className: "text-[12px] font-bold text-slate-500 mt-1" }, "Upar + Add Company dabao")) :
      h("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
        companies.map(c => h(CompanyCard, { key: c.id, company: c, userCount: userCounts[c.id] || 0, pin, onRefresh: load, setToast, onOpen: () => setSelectedCompany(c) }))),
      showAddCompany && h(AddCompanyModal, { onClose: () => setShowAddCompany(false), onCreated: () => { load(); setToast("Company created ✓"); } }),
      selectedCompany && h(CompanyDetailModal, { company: selectedCompany, pin, session, onClose: () => setSelectedCompany(null), onRefresh: load, setToast }),
      showPinSetup && h(PinSetupModal, { pinInput, setPinInput, savePin, onClose: () => pinSet && setShowPinSetup(false), isFirst: !pinSet })),
    toast && h("div", { className: "fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-full bg-black text-white text-[13px] font-black shadow-2xl" }, "✓ " + toast));
}

function CompanyCard({ company, userCount, pin, onRefresh, onOpen, setToast }) {
  const [busy, setBusy] = useState(false);
  async function deleteCompany() {
    if (!confirm(`⚠️ DELETE COMPANY\n\n${company.name} (${company.code})\n\nSaara data delete hoga!\n\nContinue?`)) return;
    const typed = prompt(`Type code to confirm:\n\n${company.code}`);
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== company.code.toUpperCase()) { alert("❌ Code mismatch"); return; }
    const enteredPin = prompt("🔐 Enter admin PIN:");
    if (enteredPin !== pin) { alert("❌ Wrong PIN"); return; }
    if (!confirm(`FINAL: Delete "${company.name}"?`)) return;
    setBusy(true);
    const { error } = await sb.from("companies").delete().eq("id", company.id);
    setBusy(false);
    if (error) { alert("Error: " + error.message); return; }
    setToast(`Deleted: ${company.name}`);
    onRefresh();
  }
  return h("div", { className: "bg-white rounded-2xl border border-slate-200 shadow-sm p-5" },
    h("div", { className: "flex items-start justify-between mb-4" },
      h("div", { className: "flex items-center gap-3" },
        h("div", { className: "w-12 h-12 rounded-xl bg-purple-100 border border-purple-200 flex items-center justify-center text-[20px] font-black text-purple-700" }, company.name[0]?.toUpperCase() || "?"),
        h("div", null,
          h("div", { className: "text-[15px] font-black text-slate-800" }, company.name),
          h("div", { className: "text-[11px] font-bold text-slate-500 font-mono" }, "Code: " + company.code))),
      h("span", { className: "px-2.5 py-1 rounded-full text-[10px] font-black border " + (company.active ? "bg-green-50 text-green-700 border-green-200" : "bg-red-50 text-red-700 border-red-200") }, company.active ? "ACTIVE" : "INACTIVE")),
    h("div", { className: "flex gap-3 mb-4" },
      h("div", { className: "flex-1 p-3 rounded-lg bg-slate-50 border border-slate-200" },
        h("div", { className: "text-[10px] font-black text-slate-500 uppercase tracking-widest" }, "Users"),
        h("div", { className: "text-[18px] font-black text-slate-800 mt-0.5" }, userCount + " / " + company.max_users)),
      h("div", { className: "flex-1 p-3 rounded-lg bg-slate-50 border border-slate-200" },
        h("div", { className: "text-[10px] font-black text-slate-500 uppercase tracking-widest" }, "Created"),
        h("div", { className: "text-[12px] font-bold text-slate-800 mt-1" }, nowTime().split(",")[0]))),
    h("div", { className: "flex gap-2" },
      h("button", { onClick: onOpen, className: "flex-1 h-10 rounded-xl bg-slate-900 hover:bg-black text-white font-black text-[12px]" }, "👥 Manage Users"),
      h("button", { onClick: deleteCompany, disabled: busy, className: "h-10 px-4 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-black text-[12px] disabled:opacity-50" }, busy ? "..." : "🗑️")));
}

function AddCompanyModal({ onClose, onCreated }) {
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [maxUsers, setMaxUsers] = useState(5);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function create() {
    if (!name.trim()) return setErr("Name required");
    const c = code.trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
    if (!c) return setErr("Code required");
    if (maxUsers < 1 || maxUsers > 10) return setErr("Max users 1-10");
    setBusy(true); setErr("");
    const { error } = await sb.from("companies").insert({ name: name.trim(), code: c, max_users: maxUsers, active: true });
    setBusy(false);
    if (error) return setErr(error.message);
    onCreated(); onClose();
  }

  return h("div", { className: "fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null, h("div", { className: "text-[17px] font-black" }, "Add Company")),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 font-bold" }, "✕")),
      h("div", { className: "space-y-4" },
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Company Name"),
          h("input", { value: name, onChange: e => setName(e.target.value), placeholder: "e.g. Shah Traders", className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500" })),
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Company Code"),
          h("input", { value: code, onChange: e => setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9_]/g, "")), placeholder: "e.g. SHAH", className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold font-mono outline-none focus:border-purple-500" })),
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Max Users (1-10)"),
          h("input", { type: "number", min: 1, max: 10, value: maxUsers, onChange: e => setMaxUsers(parseInt(e.target.value) || 5), className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500" }))),
      err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
      h("div", { className: "flex gap-3 mt-6" },
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px]" }, "Cancel"),
        h("button", { onClick: create, disabled: busy, className: "flex-1 h-11 rounded-xl bg-purple-600 text-white font-black text-[13px] disabled:opacity-50" }, busy ? "..." : "Create"))));
}

function CompanyDetailModal({ company, pin, session, onClose, onRefresh, setToast }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAddUser, setShowAddUser] = useState(false);
  const [editUser, setEditUser] = useState(null);
  const [creds, setCreds] = useState(null);

  async function loadUsers() {
    setLoading(true);
    const { data } = await sb.from("profiles").select("*").eq("company_id", company.id).order("created_at");
    setUsers(data || []);
    setLoading(false);
  }
  useEffect(() => { loadUsers(); }, [company.id]);

  async function deleteUser(user) {
    if (!confirm(`⚠️ DELETE USER\n\n${user.full_name || user.username}\n\nContinue?`)) return;
    const typed = prompt(`Type username to confirm:\n\n${user.username}`);
    if (typed === null) return;
    if (typed.trim() !== user.username) { alert("❌ Mismatch"); return; }
    const enteredPin = prompt("🔐 Enter PIN:");
    if (enteredPin !== pin) { alert("❌ Wrong PIN"); return; }
    const { error } = await sb.from("profiles").delete().eq("id", user.id);
    if (error) { alert("Error: " + error.message); return; }
    setToast(`User deleted: ${user.username}`);
    loadUsers(); onRefresh();
  }

  const canAdd = users.length < company.max_users;

  return h("div", { className: "fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-3xl bg-white rounded-2xl shadow-2xl max-h-[90vh] flex flex-col", onClick: e => e.stopPropagation() },
      h("div", { className: "px-6 py-4 border-b flex items-center justify-between" },
        h("div", { className: "flex items-center gap-3" },
          h("div", { className: "w-11 h-11 rounded-xl bg-purple-100 border border-purple-200 flex items-center justify-center text-[18px] font-black text-purple-700" }, company.name[0]?.toUpperCase() || "?"),
          h("div", null,
            h("div", { className: "text-[16px] font-black" }, company.name),
            h("div", { className: "text-[11px] font-bold text-slate-500 font-mono" }, "Code: " + company.code + " • " + users.length + "/" + company.max_users + " users"))),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 font-bold" }, "✕")),
      h("div", { className: "flex-1 overflow-auto p-6" },
        h("div", { className: "flex items-center justify-between mb-4" },
          h("div", { className: "text-[13px] font-black text-slate-700" }, "USERS"),
          canAdd ? h("button", { onClick: () => setShowAddUser(true), className: "h-9 px-4 rounded-lg bg-purple-600 text-white font-black text-[12px]" }, "+ Add User") :
          h("span", { className: "px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 text-[11px] font-black" }, "⚠️ Max users reached")),
        loading ? h("div", { className: "text-center py-10 text-slate-500 font-bold" }, "Loading...") :
        users.length === 0 ? h("div", { className: "text-center py-16 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200" },
          h("div", { className: "text-[40px] mb-2" }, "👤"),
          h("div", { className: "text-[14px] font-black text-slate-600" }, "Koi user nahi"),
          h("div", { className: "text-[12px] font-bold text-slate-500 mt-1" }, "+ Add User dabao")) :
        h("div", { className: "space-y-2" },
          users.map(u => h("div", { key: u.id, className: "p-4 rounded-xl bg-white border border-slate-200 flex items-center justify-between" },
            h("div", { className: "flex items-center gap-3" },
              h("div", { className: "w-11 h-11 rounded-full flex items-center justify-center text-white font-black text-[14px] bg-gradient-to-br from-purple-500 to-pink-500" }, (u.full_name || u.username || "?").charAt(0).toUpperCase()),
              h("div", null,
                h("div", { className: "text-[14px] font-black text-slate-800" }, u.full_name || u.username),
                h("div", { className: "text-[11px] font-bold text-slate-500 font-mono" }, "@" + u.username))),
            h("div", { className: "flex gap-2" },
              h("button", { onClick: () => setEditUser(u), className: "h-9 px-3 rounded-lg border border-slate-300 text-slate-700 font-black text-[11px]" }, "🔑 Reset Password"),
              h("button", { onClick: () => deleteUser(u), className: "h-9 px-3 rounded-lg border border-red-300 text-red-600 font-black text-[11px]" }, "🗑️")))))),
      showAddUser && h(AddUserModal, { company, pin, users, onClose: () => setShowAddUser(false), onCreated: (c) => { setCreds(c); loadUsers(); onRefresh(); } }),
      editUser && h(EditUserModal, { user: editUser, pin, onClose: () => setEditUser(null), onUpdated: () => { setToast(`Password reset: @${editUser.username}`); setEditUser(null); } }),
      creds && h(CredsModal, { creds, company, onClose: () => setCreds(null) })));
}

function AddUserModal({ company, pin, users, onClose, onCreated }) {
  const [username, setUsername] = useState("");
  const [fullName, setFullName] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  function suggestPwd() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
    setPassword((username || "user") + "@" + r);
  }

  async function create() {
    if (!username.trim()) return setErr("Username required");
    if (password.length < 6) return setErr("Password min 6 chars");
    const uname = username.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
    if (users.some(u => u.username === uname)) return setErr("Username exists");
    if (users.length >= company.max_users) return setErr("Max users reached");
    setBusy(true); setErr("");
    try {
      const email = uname + "." + company.code.toLowerCase() + EMAIL_DOMAIN;
      const t = makeThrowaway();
      const { data, error } = await t.auth.signUp({
        email, password,
        options: { data: { username: uname, full_name: fullName.trim() || uname, company_id: company.id, role: "user" } }
      });
      if (error) throw error;
      if (!data.user) throw new Error("User not created");
      const { error: pErr } = await sb.from("profiles").insert({
        id: data.user.id, username: uname, company_id: company.id, role: "user",
        full_name: fullName.trim() || uname, active: true
      });
      if (pErr) throw new Error("Profile error: " + pErr.message);
      try { await t.auth.signOut(); } catch (e) {}
      onCreated({ username: uname, password, fullName: fullName.trim() || uname, company: company.name, email });
      onClose();
    } catch (e) { setErr(e.message || "Failed"); }
    finally { setBusy(false); }
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null,
          h("div", { className: "text-[16px] font-black" }, "Add User"),
          h("div", { className: "text-[12px] font-bold text-slate-500" }, company.name + " • " + users.length + "/" + company.max_users)),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 font-bold" }, "✕")),
      h("div", { className: "space-y-4" },
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Username"),
          h("input", { value: username, autoFocus: true, onChange: e => setUsername(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, "")), placeholder: "e.g. rajesh", className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold font-mono outline-none focus:border-purple-500" })),
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Full Name (optional)"),
          h("input", { value: fullName, onChange: e => setFullName(e.target.value), placeholder: "e.g. Rajesh Kumar", className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-purple-500" })),
        h("div", null,
          h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "Password"),
          h("div", { className: "flex gap-2" },
            h("input", { value: password, onChange: e => setPassword(e.target.value), className: "flex-1 h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold font-mono outline-none focus:border-purple-500" }),
            h("button", { type: "button", onClick: suggestPwd, className: "h-12 px-4 rounded-xl border border-purple-300 bg-purple-50 text-purple-700 font-black text-[11px]" }, "🎲 Auto")))),
      err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
      h("div", { className: "flex gap-3 mt-6" },
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px]" }, "Cancel"),
        h("button", { onClick: create, disabled: busy, className: "flex-1 h-11 rounded-xl bg-purple-600 text-white font-black text-[13px] disabled:opacity-50" }, busy ? "..." : "Create User"))));
}

function EditUserModal({ user, pin, onClose, onUpdated }) {
  const [newPwd, setNewPwd] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  function suggestPwd() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
    setNewPwd(user.username + "@" + r);
  }

  async function reset() {
    if (newPwd.length < 6) return setErr("Password min 6 chars");
    const enteredPin = prompt("🔐 Enter admin PIN:");
    if (enteredPin !== pin) { setErr("Wrong PIN"); return; }
    setBusy(true); setErr("");
    try {
      const { data, error } = await sb.rpc("admin_reset_password", { target_user_id: user.id, new_password: newPwd });
      if (error) throw error;
      if (!data) throw new Error("Reset failed");
      onUpdated(newPwd);
    } catch (e) { setErr(e.message || "Reset failed"); }
    finally { setBusy(false); }
  }

  return h("div", { className: "fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "flex items-center justify-between mb-5" },
        h("div", null,
          h("div", { className: "text-[16px] font-black" }, "Reset Password"),
          h("div", { className: "text-[12px] font-bold text-slate-500" }, "@" + user.username)),
        h("button", { onClick: onClose, className: "w-8 h-8 rounded-full bg-slate-100 font-bold" }, "✕")),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase text-slate-500 block mb-1.5" }, "New Password"),
        h("div", { className: "flex gap-2" },
          h("input", { value: newPwd, autoFocus: true, onChange: e => setNewPwd(e.target.value), className: "flex-1 h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold font-mono outline-none focus:border-purple-500" }),
          h("button", { type: "button", onClick: suggestPwd, className: "h-12 px-4 rounded-xl border border-purple-300 bg-purple-50 text-purple-700 font-black text-[11px]" }, "🎲 Auto"))),
      err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
      h("div", { className: "flex gap-3 mt-6" },
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px]" }, "Cancel"),
        h("button", { onClick: reset, disabled: busy, className: "flex-1 h-11 rounded-xl bg-purple-600 text-white font-black text-[13px] disabled:opacity-50" }, busy ? "..." : "Reset"))));
}

function CredsModal({ creds, company, onClose }) {
  const txt = `ULTRA LEDGER Login\n\nCompany: ${creds.company}\nUsername: ${creds.username}\nPassword: ${creds.password}`;
  return h("div", { className: "fixed inset-0 z-[70] bg-black/60 flex items-center justify-center p-4", onClick: onClose },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6", onClick: e => e.stopPropagation() },
      h("div", { className: "text-center mb-4" },
        h("div", { className: "text-[44px] mb-1" }, "✅"),
        h("div", { className: "text-[16px] font-black text-green-700" }, "User Created!")),
      h("div", { className: "p-4 rounded-xl bg-green-50 border-2 border-green-300 space-y-2 mb-4" },
        h("div", { className: "text-[13px] font-bold text-green-900" }, "Company: ", h("span", { className: "font-black" }, creds.company)),
        h("div", { className: "text-[13px] font-bold text-green-900" }, "Username: ", h("span", { className: "font-black font-mono" }, creds.username)),
        h("div", { className: "text-[13px] font-bold text-green-900" }, "Password: ", h("span", { className: "font-black font-mono" }, creds.password))),
      h("div", { className: "text-[11px] font-bold text-slate-500 mb-4 text-center" }, "⚠️ Ye credentials client ko bhej dein"),
      h("div", { className: "flex gap-3" },
        h("button", { onClick: () => { navigator.clipboard.writeText(txt); alert("Copied!"); }, className: "flex-1 h-11 rounded-xl bg-slate-800 text-white font-black text-[13px]" }, "📋 Copy"),
        h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px]" }, "Done"))));
}

function PinSetupModal({ pinInput, setPinInput, savePin, onClose, isFirst }) {
  return h("div", { className: "fixed inset-0 z-[80] bg-black/70 flex items-center justify-center p-4" },
    h("div", { className: "w-full max-w-md bg-white rounded-2xl shadow-2xl p-6" },
      h("div", { className: "text-center mb-4" },
        h("div", { className: "text-[44px] mb-2" }, "🔐"),
        h("div", { className: "text-[16px] font-black" }, isFirst ? "Set Admin PIN" : "Change PIN"),
        h("div", { className: "text-[12px] font-bold text-slate-500 mt-1" }, "Delete ke waqt ye PIN maangega")),
      h("input", { type: "password", autoFocus: true, maxLength: 6, value: pinInput,
        onChange: e => setPinInput(e.target.value.replace(/[^0-9]/g, "")),
        placeholder: "4-6 digit PIN",
        className: "w-full h-14 rounded-xl border-2 border-slate-300 px-4 text-[20px] font-black tracking-widest text-center outline-none focus:border-purple-500" }),
      h("div", { className: "flex gap-3 mt-4" },
        !isFirst && h("button", { onClick: onClose, className: "flex-1 h-11 rounded-xl border border-slate-300 font-black text-[13px]" }, "Cancel"),
        h("button", { onClick: savePin, className: "flex-1 h-11 rounded-xl bg-purple-600 text-white font-black text-[13px]" }, "Save PIN"))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
