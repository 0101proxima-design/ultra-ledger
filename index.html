<script>
const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = "https://kzgqsjbayluqyhjhytkt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const EMAIL_DOMAIN = "@ultraledger.local";

const fmtINR = (n) => isNaN(n) ? "₹0/-" : "₹" + Number(n).toLocaleString("en-IN") + "/-";
const absINR = (n) => "₹" + Math.abs(n).toLocaleString("en-IN") + "/-";
const todayISO = () => new Date().toISOString().slice(0, 10);
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const dmy = (iso) => { if (!iso) return "-"; const p = iso.split("-"); return p.length === 3 && p[0].length === 4 ? p[2] + "-" + p[1] + "-" + p[0] : iso; };

const SEED_PARTIES = [
  { id: "AA", name: "AA", status: "Active" },
  { id: "BB", name: "BB", status: "Active" }
];
const SEED_OPEN = [
  { id: "bb_open", pairId: "opening_bb", date: todayISO(), time: "09:15", partyId: "BB", counterPartyId: "", amount: 37186, remark: "Opening", createdAt: 5000, openingLocked: true },
  { id: "aa_open", pairId: "opening_aa", date: todayISO(), time: "09:15", partyId: "AA", counterPartyId: "", amount: -37186, remark: "Opening", createdAt: 5000, openingLocked: true }

const T = {
  pageBg: "bg-[#f8fafc]", header: "bg-white border-slate-200",

  card: "bg-white border-slate-200 shadow-sm", text: "text-slate-900",
  input: "bg-white border-slate-200 text-slate-900", tableHeader: "bg-slate-100",
  modBtn: "bg-yellow-50 text-yellow-700 border border-cyan-200",

};

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function doLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      const uname = username.trim().toLowerCase();
      if (!uname) throw new Error("Username required");
      const { data: prof } = await sb.from("profiles").select("username, company_id").eq("username", uname).maybeSingle();
      if (!prof || !prof.company_id) throw new Error("Username not found");
      const { data: comp } = await sb.from("companies").select("code").eq("id", prof.company_id).single();
      if (!comp) throw new Error("Company not found");
      const email = uname + "." + comp.code.toLowerCase() + EMAIL_DOMAIN;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Wrong username or password");
      if (onLogin) await onLogin(data.session);
    } catch (e) { setErr(e.message || "Login failed"); }
    finally { setBusy(false); }
  }

  return h("div", { className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-cyan-50 p-4" },
    h("div", { className: "w-full max-w-md" },
      h("div", { className: "text-center mb-6" },
        h("div", { className: "text-[52px] mb-2" }, "📒"),
        h("div", { className: "text-[26px] font-black text-slate-800" }, "ULTRA LEDGER"),
        h("div", { className: "text-[12px] font-bold text-slate-500 tracking-widest uppercase mt-1" }, "Sign in")),
      h("form", { onSubmit: doLogin, className: "bg-white rounded-2xl shadow-xl border border-slate-200 p-7" },
        h("div", { className: "space-y-4" },
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Username"),
            h("input", { value: username, onChange: e => setUsername(e.target.value.toLowerCase()), autoFocus: true, placeholder: "username",
              className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-cyan-500" })),
          h("div", null,
            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Password"),
            h("input", { type: "password", value: password, onChange: e => setPassword(e.target.value), placeholder: "••••••••",
              className: "w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-cyan-500" }))),
        err && h("div", { className: "mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-[12px] font-bold text-red-700" }, "❌ " + err),
        h("button", { type: "submit", disabled: busy,
          className: "mt-5 w-full h-12 rounded-xl bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 text-white font-black text-[14px]" },
          busy ? "..." : "LOGIN"))));
}

function ChangePasswordCard() {
  const [cur, setCur] = useState("");
  const [nw, setNw] = useState("");
  const [cf, setCf] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function change() {
    setMsg(null);
    if (!cur) return setMsg({ t: "err", m: "Current password required" });
    if (!nw || nw.length < 6) return setMsg({ t: "err", m: "New password min 6 chars" });
    if (nw !== cf) return setMsg({ t: "err", m: "Passwords don't match" });
    if (cur === nw) return setMsg({ t: "err", m: "New password must be different" });
    setBusy(true);
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user || !user.email) throw new Error("Session expired");
      const { error: vErr } = await sb.auth.signInWithPassword({ email: user.email, password: cur });
      if (vErr) throw new Error("Current password is wrong");
      const { error: uErr } = await sb.auth.updateUser({ password: nw });
      if (uErr) throw new Error(uErr.message);
      setMsg({ t: "ok", m: "✅ Password changed!" });
      setCur(""); setNw(""); setCf("");
    } catch (e) { setMsg({ t: "err", m: e.message }); }
    finally { setBusy(false); }
  }

  function suggest() {
    const c = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 8; i++) r += c[Math.floor(Math.random() * c.length)];
    const p = "pass@" + r;
    setNw(p); setCf(p);
  }

  return h("div", { className: "rounded-xl border p-6 " + T.card },
    h("div", { className: "font-black text-[15px] mb-4 uppercase" }, "🔑 CHANGE PASSWORD"),
    h("div", { className: "space-y-3" },
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "Current Password"),
        h("input", { type: "password", value: cur, onChange: e => { setCur(e.target.value); setMsg(null); }, placeholder: "Enter current password",
          className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input })),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "New Password"),
        h("div", { className: "flex gap-2" },
          h("input", { type: "password", value: nw, onChange: e => { setNw(e.target.value); setMsg(null); }, placeholder: "Enter new password",
            className: "flex-1 h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input }),
          h("button", { type: "button", onClick: suggest, className: "h-12 px-4 rounded-lg bg-cyan-100 text-cyan-700 font-black text-[11px]" }, "🎲"))),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "Confirm Password"),
        h("input", { type: "password", value: cf, onChange: e => { setCf(e.target.value); setMsg(null); }, placeholder: "Re-enter new password",
          className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input })),
      msg && h("div", { className: "p-3 rounded-lg text-[12px] font-bold " + (msg.t === "ok" ? "bg-green-50 border border-green-200 text-green-700" : "bg-red-50 border border-red-200 text-red-700") }, msg.m),
      h("button", { onClick: change, disabled: busy,
        className: "w-full h-12 rounded-lg font-black text-[14px] " + (busy ? "opacity-50 " : "") + T.addBtn },
        busy ? "Changing..." : "🔒 Change Password")));
}

function OriginalApp({ onLogout, cloudState, saveCloud, cloudSaveStatus, profile, companyId }) {
  const [tab, setTab] = useState("ledger");
  const [companyName, setCompanyName] = useState((cloudState && cloudState.companyName) || "");
  const [parties, setParties] = useState((cloudState && cloudState.parties) || SEED_PARTIES);
  const [ledgers, setLedgers] = useState((cloudState && cloudState.ledgers) || SEED_OPEN);
  const [finals, setFinals] = useState((cloudState && cloudState.finals) || []);
  const [selectedParty, setSelectedParty] = useState("BB");
  const [toast, setToast] = useState(null);
  const [counter, setCounter] = useState("AA");
  const [amount, setAmount] = useState("");
  const [remark, setRemark] = useState("");
  const [search, setSearch] = useState("");
  const [editEntry, setEditEntry] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [deleteEntry, setDeleteEntry] = useState(null);
  const [confirmFinal, setConfirmFinal] = useState(false);
  const [lockedInfo, setLockedInfo] = useState(null);
  const [pin, setPin] = useState((cloudState && cloudState.pin) || "");
  const [pinInput, setPinInput] = useState("");
  const [pinMsg, setPinMsg] = useState("");
  const [companyNameInput, setCompanyNameInput] = useState((cloudState && cloudState.companyName) || "");
  const [history, setHistory] = useState((cloudState && cloudState.history) || []);
  const [newPartyName, setNewPartyName] = useState("");
  const [partyConfirm, setPartyConfirm] = useState(null);
  const [editParty, setEditParty] = useState(null);
  const [editPartyName, setEditPartyName] = useState("");
  const [toggleConfirm, setToggleConfirm] = useState(null);
  const [filterFrom, setFilterFrom] = useState("");
  const [filterTo, setFilterTo] = useState("");
  const [finalFilter, setFinalFilter] = useState("");
  const [frOpen, setFrOpen] = useState(false);
  const [frSearch, setFrSearch] = useState("");
  const [pinPrompt, setPinPrompt] = useState(null);
  const [pinPromptInput, setPinPromptInput] = useState("");
  const [pinPromptErr, setPinPromptErr] = useState("");
  const [lastBackupTime, setLastBackupTime] = useState((cloudState && cloudState.lastBackupTime) || 0);

  const amountRef = useRef(null);
  const remarkRef = useRef(null);
  const counterRef = useRef(null);
  const addBtnRef = useRef(null);
  const fileInputRef = useRef(null);
  const saveTimerRef = useRef(null);
  const skipSaveRef = useRef(true);

  useEffect(() => { setTimeout(() => { skipSaveRef.current = false; }, 1500); }, []);

  // INSTANT local save
  useEffect(() => {
    if (skipSaveRef.current) return;
    const snap = { parties, ledgers, finals, pin, companyName, history, lastBackupTime, selectedParty, counter, savedAt: Date.now() };
    try { localStorage.setItem("ul_state_" + (companyId || "default"), JSON.stringify(snap)); } catch(e) {}
  }, [parties, ledgers, finals, pin, companyName, history, lastBackupTime, selectedParty, counter, companyId]);

  // Cloud save (debounced)
  useEffect(() => {
    if (skipSaveRef.current) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      if (saveCloud) saveCloud({ parties, ledgers, finals, pin, companyName, history, lastBackupTime, selectedParty, counter, savedAt: Date.now() });
    }, 500);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [parties, ledgers, finals, pin, companyName, history, lastBackupTime, selectedParty, counter]);

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 2500); return () => clearTimeout(t); } }, [toast]);
  useEffect(() => { if (tab !== "ledger") return; const t = setTimeout(() => { if (counterRef.current) counterRef.current.focus(); }, 350); return () => clearTimeout(t); }, [tab, selectedParty]);

  const selectedPartyObj = parties.find(p => p.id === selectedParty);
  const isDeactive = selectedPartyObj && selectedPartyObj.status !== "Active";
  const partyEntries = useMemo(() => ledgers.filter(l => l.partyId === selectedParty).sort((a,b) => a.createdAt - b.createdAt), [ledgers, selectedParty]);
  const balMap = useMemo(() => { const m = new Map(); let run = 0; partyEntries.forEach(e => { run += e.amount; m.set(e.id, run); }); return { map: m, total: run }; }, [partyEntries]);
  const allPartyBalances = useMemo(() => { const m = {}; parties.forEach(p => { m[p.id] = ledgers.filter(l => l.partyId === p.id).reduce((a, e) => a + e.amount, 0); }); return m; }, [parties, ledgers]);
  const filteredEntries = useMemo(() => { if (!search.trim()) return partyEntries; const s = search.toLowerCase(); return partyEntries.filter(e => (dmy(e.date) + " " + (e.counterPartyId || "") + " " + (e.remark || "") + " " + e.amount).toLowerCase().includes(s)); }, [partyEntries, search]);

  const isLocked = (e) => {
    if (e.openingLocked) return true;
    if ((e.remark || "").toLowerCase() === "opening") return true;
    if (e.finalLocked) return true;
    if (e.pairId && finals.some(g => (g.counterEntries || []).some(fe => fe.pairId === e.pairId))) return true;
    return false;
  };

  const trial = useMemo(() => {
    let src = ledgers;
    if (filterFrom) src = src.filter(e => e.date >= filterFrom);
    if (filterTo) src = src.filter(e => e.date <= filterTo);
    const dp = [], cp = [];
    parties.filter(p => p.status === "Active").forEach(p => {
      const bal = src.filter(l => l.partyId === p.id).reduce((a, e) => a + e.amount, 0);
      if (bal < 0) dp.push({ party: p, bal });
      else if (bal > 0) cp.push({ party: p, bal });
    });
    const debit = dp.reduce((a, x) => a + Math.abs(x.bal), 0);
    const credit = cp.reduce((a, x) => a + x.bal, 0);
    const diff = credit - debit;
    const status = diff === 0 ? "BALANCED" : diff > 0 ? "CREDIT EXCESS " + Math.abs(diff).toLocaleString("en-IN") : "DEBIT EXCESS " + Math.abs(diff).toLocaleString("en-IN");
    return { debitParties: dp, creditParties: cp, debit, credit, diff, status };
  }, [ledgers, parties, filterFrom, filterTo]);

  const finalRows = useMemo(() => {
    if (!finals.length || !finalFilter) return [];
    const filtered = finals.filter(g => g.partyId === finalFilter);
    const sorted = filtered.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    let run = 0; const out = [];
    sorted.forEach(g => {
      g.entries.forEach(e => {
        const isCF = e.carryForward === true;
        if (!isCF) run += e.amount;
        out.push({ id: e.id, partyId: g.partyId, date: e.date, counterPartyId: isCF ? "B/F" : e.counterPartyId, remark: isCF ? "Opening" : e.remark, _debit: (!isCF && e.amount < 0) ? Math.abs(e.amount).toString() : "-", _credit: (!isCF && e.amount > 0) ? e.amount.toString() : "-", _bal: run, isClosing: false, isOpeningEntry: isCF });
      });
      out.push({ id: "closing_" + g.id, partyId: g.partyId, date: g.closedAt, counterPartyId: "-", remark: "FINAL CLOSING • " + g.partyId, _debit: "-", _credit: "-", _bal: run, isClosing: true });
    });
    return out;
  }, [finals, finalFilter]);

  const frRows = useMemo(() => {
    if (!finals.length) return [];
    const filtered = finals.filter(g => g.partyId === selectedParty);
    const sorted = filtered.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    let run = 0; const out = [];
    sorted.forEach(g => {
      g.entries.forEach(e => {
        const isCF = e.carryForward === true;
        if (!isCF) run += e.amount;
        out.push({ id: e.id, date: e.date, counterPartyId: isCF ? "B/F" : e.counterPartyId, remark: isCF ? "Opening" : e.remark, _debit: (!isCF && e.amount < 0) ? Math.abs(e.amount).toString() : "-", _credit: (!isCF && e.amount > 0) ? e.amount.toString() : "-", _bal: run, isClosing: false, isOpeningEntry: isCF });
      });
      out.push({ id: "closing_" + g.id, date: g.closedAt, counterPartyId: "-", remark: "FINAL CLOSING • " + g.partyId, _debit: "-", _credit: "-", _bal: run, isClosing: true });
    });
    return out;
  }, [finals, selectedParty]);

  const showToast = (msg) => setToast(msg);

  const safeLogout = async () => {
    try {
      const snap = { parties, ledgers, finals, pin, companyName, history, lastBackupTime, selectedParty, counter, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + (companyId || "default"), JSON.stringify(snap)); } catch(e) {}
      if (saveCloud) { try { await saveCloud(snap); } catch(e) { console.error(e); } }
      await new Promise(r => setTimeout(r, 400));
      await onLogout();
    } catch (e) { console.error(e); await onLogout(); }
  };

  const requirePin = (fn, label) => {
    if (!pin) return fn();
    setPinPrompt({ run: fn, label: label || "Confirm" });
    setPinPromptInput(""); setPinPromptErr("");
  };
  const confirmPin = () => {
    if (pinPromptInput === pin) { const fn = pinPrompt.run; setPinPrompt(null); setPinPromptInput(""); setPinPromptErr(""); setTimeout(() => fn(), 50); }
    else setPinPromptErr("Wrong PIN");
  };

  const parseAmounts = (s) => {
    if (!s) return [];
    const parts = s.split("/").map(x => x.trim()).filter(Boolean);
    const nums = [];
    parts.forEach(p => { const n = parseFloat(p); if (!isNaN(n) && n !== 0) nums.push(n); });
    if (!nums.length) { const n = parseFloat(s); if (!isNaN(n) && n !== 0) nums.push(n); }
    return nums;
  };

  const handleAdd = () => {
    const nums = parseAmounts(amount);
    if (!nums.length) return showToast("Enter amount");
    if (selectedParty === counter) return showToast("Same party");
    if (isDeactive) return showToast(selectedParty + " DEACTIVE");
    const cpObj = parties.find(p => p.id === counter);
    if (cpObj && cpObj.status !== "Active") return showToast(counter + " DEACTIVE");
    const date = todayISO(), time = nowTime(), now = Date.now(), newEntries = [];
    const finalRemark = remark.trim();
    nums.forEach((n, i) => {
      const pairId = "pair_" + now + "_" + i;
      newEntries.push({ id: "e_" + now + "_" + i + "_1", pairId, date, time, partyId: selectedParty, counterPartyId: counter, amount: n, remark: finalRemark, createdAt: now + i * 2 });
      newEntries.push({ id: "e_" + now + "_" + i + "_2", pairId, date, time, partyId: counter, counterPartyId: selectedParty, amount: -n, remark: finalRemark, createdAt: now + i * 2 + 1 });
    });
    setLedgers(prev => prev.concat(newEntries));
    setAmount(""); setRemark("");
    showToast("Added " + nums.map(fmtINR).join(" / "));
    setTimeout(() => { if (counterRef.current) counterRef.current.focus(); }, 50);
  };

  const handleModify = (e) => {
    if (isLocked(e)) return setLockedInfo({ reason: "Entry locked" });
    setEditEntry(e);
    setEditForm({ date: e.date, counter: e.counterPartyId, amount: String(e.amount), remark: e.remark || "" });
  };

  const saveModify = () => {
    const amt = parseFloat(editForm.amount);
    if (isNaN(amt) || amt === 0) return showToast("Invalid amount");
    const finalRemark = (editForm.remark || "").trim();
    setLedgers(prev => prev.map(e => {
      if (e.pairId !== editEntry.pairId) return e;
      if (isLocked(e)) return e;
      if (e.partyId === editEntry.partyId) return { ...e, date: editForm.date, counterPartyId: editForm.counter, amount: amt, remark: finalRemark };
      return { ...e, date: editForm.date, partyId: editForm.counter, counterPartyId: editEntry.partyId, amount: -amt, remark: finalRemark };
    }));
    setEditEntry(null); showToast("Modified");
  };

  const handleDelete = (e) => {
    if (isLocked(e)) return setLockedInfo({ reason: "Entry locked" });
    setDeleteEntry(e);
  };

  const confirmDelete = () => {
    const { pairId, id } = deleteEntry;
    setLedgers(prev => prev.filter(e => {
      if (isLocked(e)) return true;
      if (e.pairId && pairId) return e.pairId !== pairId;
      return e.id !== id;
    }));
    setDeleteEntry(null); showToast("Deleted");
  };

  const doFinal = () => {
    const entries = ledgers.filter(l => l.partyId === selectedParty).sort((a, b) => a.createdAt - b.createdAt);
    const balance = entries.reduce((a, e) => a + e.amount, 0);
    const now = Date.now();
    const counterEntries = ledgers.filter(l => l.counterPartyId === selectedParty && !l.openingLocked && (l.remark || "").toLowerCase() !== "opening" && !l.finalLocked);
    setFinals(prev => prev.concat([{ id: "final_" + now, partyId: selectedParty, closedAt: todayISO(), entries, counterEntries, balance, createdAt: now }]));
    const cps = new Set(counterEntries.map(e => e.pairId));
    setLedgers(prev => prev.filter(l => l.partyId !== selectedParty).map(l => cps.has(l.pairId) ? { ...l, finalLocked: true } : l)
      .concat([{ id: "open_" + now, pairId: "opening_" + now, date: todayISO(), time: nowTime(), partyId: selectedParty, counterPartyId: "", amount: balance, remark: "Opening", createdAt: now + 5, openingLocked: true, carryForward: true }]));
    setConfirmFinal(false); showToast(selectedParty + " Finalized");
  };

  const addParty = () => {
    const name = newPartyName.trim().toUpperCase();
    if (!name) return showToast("Enter name");
    if (parties.some(p => p.id === name)) return showToast("Exists");
    requirePin(() => setPartyConfirm({ name }), "Create Party " + name);
  };

  const pages = { ledger: ledgerPage, party: partyPage, final: finalPage, trial: trialPage, profile: profilePage };

  return h("div", { className: "min-h-screen flex flex-col " + T.pageBg + " " + T.text },
    header,

    editEntry && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setEditEntry(null) },

          h("div", { className: "flex gap-2" },
            h("button", { onClick: () => setEditEntry(null), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
            h("button", { onClick: saveModify, className: "flex-1 h-11 rounded-lg font-black " + T.addBtn }, "Save"))))),

      h("div", { className: "w-full max-w-[440px] rounded-xl border bg-white shadow-2xl p-5", onClick: e => e.stopPropagation() },
        h("div", { className: "font-black text-[15px] mb-3" }, "Delete Entry?"),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: () => setDeleteEntry(null), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
          h("button", { onClick: confirmDelete, className: "flex-1 h-11 rounded-lg bg-red-600 text-white font-black" }, "Delete")))),

    confirmFinal && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setConfirmFinal(false) },
      h("div", { className: "w-full max-w-[440px] rounded-xl border bg-white shadow-2xl p-5", onClick: e => e.stopPropagation() },
        h("div", { className: "font-black text-[15px] mb-3" }, "FINAL Closing – " + selectedParty + "?"),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: () => setConfirmFinal(false), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
          h("button", { onClick: doFinal, className: "flex-1 h-11 rounded-lg font-black " + T.closingBtn }, "Confirm")))),

    lockedInfo && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setLockedInfo(null) },

        h("div", { className: "font-black text-[15px] mb-3" }, "🔒 Locked"),
        h("p", { className: "text-[13px] mb-4" }, lockedInfo.reason),
        h("button", { onClick: () => setLockedInfo(null), className: "w-full h-11 rounded-lg bg-black text-white font-black" }, "OK"))),

    partyConfirm && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setPartyConfirm(null) },
      h("div", { className: "w-full max-w-[440px] rounded-xl border bg-white shadow-2xl p-5", onClick: e => e.stopPropagation() },
        h("div", { className: "font-black text-[15px] mb-3" }, 'Create "' + partyConfirm.name + '"?'),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: () => setPartyConfirm(null), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
          h("button", { onClick: confirmAddParty, className: "flex-1 h-11 rounded-lg font-black " + T.addBtn }, "Create")))),

    toggleConfirm && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setToggleConfirm(null) },
      h("div", { className: "w-full max-w-[440px] rounded-xl border bg-white shadow-2xl p-5", onClick: e => e.stopPropagation() },
        h("div", { className: "font-black text-[15px] mb-3" }, toggleConfirm.next + " " + toggleConfirm.party.id + "?"),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: () => setToggleConfirm(null), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "No"),
          h("button", { onClick: confirmToggle, className: "flex-1 h-11 rounded-lg font-black " + (toggleConfirm.next === "Deactive" ? "bg-red-600 text-white" : T.addBtn) }, "Yes")))),

    editParty && h("div", { className: "fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4", onClick: () => setEditParty(null) },
      h("div", { className: "w-full max-w-[440px] rounded-xl border bg-white shadow-2xl p-5", onClick: e => e.stopPropagation() },
        h("div", { className: "font-black text-[15px] mb-3" }, "Modify Party"),
        h("input", { value: editPartyName, onChange: e => setEditPartyName(e.target.value.toUpperCase()), className: "w-full h-11 rounded-lg border px-3 text-[15px] font-black " + T.input }),
        h("div", { className: "flex gap-2 mt-3" },
          h("button", { onClick: () => setEditParty(null), className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
          h("button", { onClick: savePartyEdit, className: "flex-1 h-11 rounded-lg font-black " + T.addBtn }, "Save")))),

    frOpen && h("div", { className: "fixed inset-0 z-[90] bg-black/70 flex items-center justify-center p-4", onClick: () => setFrOpen(false) },
      h("div", { className: "w-full max-w-[1100px] rounded-xl bg-white overflow-hidden flex flex-col max-h-[92vh]", onClick: e => e.stopPropagation() },
        h("div", { className: "px-4 py-3 flex justify-between items-center bg-gradient-to-r from-blue-700 to-cyan-600" },
          h("div", { className: "text-white font-black" }, "FINAL REPORT – " + selectedParty),
          h("button", { onClick: () => setFrOpen(false), className: "w-8 h-8 rounded-lg bg-white/20 text-white font-black" }, "✕")),
        h("div", { className: "p-3 flex justify-between" },
          h("input", { value: frSearch, onChange: e => setFrSearch(e.target.value), placeholder: "Search...", className: "h-9 w-[280px] rounded-lg border px-3 text-[12px] " + T.input }),
          h("button", { onClick: exportFR, className: "h-9 px-4 rounded-lg bg-emerald-600 text-white font-black text-[13px]" }, "📊 Excel")),
        h("div", { className: "overflow-auto flex-1" },
          h("table", { className: "w-full" },
            h("thead", { className: "sticky top-0 " + T.tableHeader },
              h("tr", null, ["Date", "Counter", "Remark", "Debit", "Credit", "Balance"].map(hd => h("th", { key: hd, className: "text-left py-1.5 px-2.5 text-[11px] font-black uppercase" }, hd)))),
            h("tbody", null,
              frRows.length === 0 && h("tr", null, h("td", { colSpan: 6, className: "p-8 text-center opacity-60" }, "No FINAL records")),
              frRows.map(r => h("tr", { key: r.id, className: "border-t " + (r.isClosing ? "bg-cyan-300" : r.isOpeningEntry ? "bg-amber-50" : "") },
                h("td", { className: "py-0.5 px-2.5 font-mono text-[12px]" }, dmy(r.date)),
                h("td", { className: "py-0.5 px-2.5 font-bold" }, r.counterPartyId || "-"),
                h("td", { className: "py-0.5 px-2.5 font-semibold" }, r.remark || "-"),

                h("td", { className: "py-0.5 px-2 text-right font-mono" }, r._credit === "-" ? "-" : fmtINR(r._credit)),
                h("td", { className: "py-0.5 px-2 text-right font-mono font-black " + (r._bal < 0 ? "text-red-600" : "text-green-600") }, fmtINR(r._bal))))))))),

    pinPrompt && h("div", { className: "fixed inset-0 z-[95] bg-black/70 flex items-center justify-center p-4", onClick: () => setPinPrompt(null) },

          onChange: e => { setPinPromptInput(e.target.value.replace(/[^0-9]/g, "")); setPinPromptErr(""); },
          onKeyDown: e => { if (e.key === "Enter") { e.preventDefault(); confirmPin(); } },
          placeholder: "PIN", className: "w-full h-12 rounded-lg border-2 px-4 text-[18px] font-black tracking-widest text-center" }),
        pinPromptErr && h("div", { className: "text-[12px] text-red-600 text-center font-bold" }, pinPromptErr),

          h("button", { onClick: () => setPinPrompt(null), className: "flex-1 h-11 rounded-lg border font-black" }, "Cancel"),
          h("button", { onClick: confirmPin, className: "flex-1 h-11 rounded-lg bg-black text-white font-black" }, "Confirm")))),

    toast && h("div", { className: "fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-full bg-black text-white text-[14px] font-black shadow-2xl" }, "✓ " + toast)
  );
}

function MainApp() {
  const [session, setSession] = useState(null);
  const [cloudState, setCloudState] = useState(null);
  const [ready, setReady] = useState(false);
  const [bootMsg, setBootMsg] = useState("Connecting...");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [companyId, setCompanyId] = useState(null);
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) await loadAll(session);
        else setReady(true);
      } catch (e) { console.error(e); setReady(true); }
    })();
    const { data: sub } = sb.auth.onAuthStateChange(async (event, sess) => {
      if (event === "SIGNED_OUT") { setSession(null); setCloudState(null); setCompanyId(null); setProfile(null); setReady(true); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function loadAll(sess) {
    try {
      setBootMsg("Loading profile...");
      const { data: prof } = await sb.from("profiles").select("*").eq("id", sess.user.id).single();
      if (!prof || !prof.company_id) { await sb.auth.signOut(); setReady(true); return; }
      setCompanyId(prof.company_id);
      setProfile(prof);
      setSession(sess);
      setBootMsg("Loading ledger...");

      let cloudData = null;
      try {
        const { data: st } = await sb.from("company_state").select("state").eq("company_id", prof.company_id).maybeSingle();
        if (st && st.state) cloudData = st.state;
        console.log("☁️ Cloud:", cloudData ? (cloudData.ledgers || []).length + " entries" : "none");
      } catch(e) { console.error(e); }

      let localData = null;
      try {
        const raw = localStorage.getItem("ul_state_" + prof.company_id);
        if (raw) { localData = JSON.parse(raw); console.log("💾 Local:", (localData.ledgers || []).length + " entries"); }
      } catch(e) {}

      const candidates = [cloudData, localData].filter(d => d && Array.isArray(d.ledgers));
      let finalState;
      if (candidates.length === 0) {
        finalState = { parties: SEED_PARTIES, ledgers: SEED_OPEN, finals: [], history: [], companyName: "", theme: "ocean", pin: "", lastBackupTime: 0, savedAt: Date.now() };
      } else {
        candidates.sort((a, b) => {
          const lenDiff = (b.ledgers || []).length - (a.ledgers || []).length;
          if (lenDiff !== 0) return lenDiff;
          return (b.savedAt || 0) - (a.savedAt || 0);
        });
        finalState = candidates[0];
      }
      console.log("✅ Using:", (finalState.ledgers || []).length + " entries");
      setCloudState(finalState);
      setReady(true);
    } catch (e) { console.error(e); setReady(true); }
  }

  async function saveCloud(newState) {
    if (!companyId || !session) return;
    setSaveStatus("saving");
    try {
      const { error } = await sb.from("company_state").upsert({
        company_id: companyId,
        state: newState,
        updated_at: new Date().toISOString(),
        updated_by: session.user.id
      }, { onConflict: "company_id" });
      if (error) {
        console.error("❌ Cloud save failed:", error);
        setSaveStatus("error");
        return;
      }
      console.log("✅ Cloud saved:", (newState.ledgers || []).length + " entries");
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus("idle"), 1500);
    } catch (e) { console.error(e); setSaveStatus("error"); }
  }

  if (!ready) return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-50" },
    h("div", { className: "text-center" },
      h("div", { className: "text-[40px] mb-3" }, "📒"),
      h("div", { className: "text-[15px] font-black text-slate-700" }, bootMsg)));

  if (!session) return h(LoginScreen, { onLogin: loadAll });
  return h(OriginalApp, { onLogout: () => sb.auth.signOut(), cloudState, saveCloud, cloudSaveStatus: saveStatus, profile, companyId });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
</script>
</body>
