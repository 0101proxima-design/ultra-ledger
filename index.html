function fmtINR(n) {
  if (isNaN(n)) return "₹0/-";
  return "₹" + Number(n).toLocaleString("en-IN") + "/-";
}
function absINR(n) {
  return "₹" + Math.abs(n).toLocaleString("en-IN") + "/-";
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function nowTime() {
  var d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function dmy(iso) {
  if (!iso) return "-";
  var p = iso.split("-");
  return (p.length === 3 && p[0].length === 4) ? p[2] + "-" + p[1] + "-" + p[0] : iso;
}

  var st4 = useState("");
  var err = st4[0], setErr = st4[1];

  function doLogin(e) {
    e.preventDefault();
    setErr("");
    setBusy(true);
    var uname = u.trim().toLowerCase();
    if (!uname) {
      setErr("Username required");
      setBusy(false);
      return;
    }
    sb.from("profiles").select("username, company_id").eq("username", uname).maybeSingle().then(function(pr) {
      if (!pr.data || !pr.data.company_id) {
        setErr("Username not found");
        setBusy(false);
        return;
      }
      sb.from("companies").select("code").eq("id", pr.data.company_id).single().then(function(co) {
        if (!co.data) {
          setErr("Company not found");
          setBusy(false);
          return;
        }
        var email = uname + "." + co.data.code.toLowerCase() + DOMAIN;
        sb.auth.signInWithPassword({ email: email, password: p }).then(function(r) {
          setBusy(false);
          if (r.error) {
            setErr("Wrong username or password");
            return;
          }
          if (props.onLogin) props.onLogin(r.data.session);
        });
      });
    });
  }

  return h("div", { className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-cyan-50 p-4" },
    h("div", { className: "w-full max-w-md" },

            h("label", { className: "text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Username"),

          ),

function ChangePasswordCard(props) {
  var st1 = useState("");
  var cur = st1[0], setCur = st1[1];
  var st2 = useState("");
  var nw = st2[0], setNw = st2[1];
  var st3 = useState("");
  var cf = st3[0], setCf = st3[1];
  var st4 = useState(false);
  var busy = st4[0], setBusy = st4[1];
  var st5 = useState(null);
  var msg = st5[0], setMsg = st5[1];

  function change() {
    setMsg(null);
    if (!cur) { setMsg({ t: "err", m: "Current password required" }); return; }
    if (!nw || nw.length < 6) { setMsg({ t: "err", m: "New password min 6 chars" }); return; }
    if (nw !== cf) { setMsg({ t: "err", m: "Passwords don't match" }); return; }
    setBusy(true);
    sb.auth.getUser().then(function(r) {
      if (!r.data.user || !r.data.user.email) {
        setMsg({ t: "err", m: "Session expired" });
        setBusy(false);
        return;
      }
      sb.auth.signInWithPassword({ email: r.data.user.email, password: cur }).then(function(vr) {
        if (vr.error) {
          setMsg({ t: "err", m: "Current password is wrong" });
          setBusy(false);
          return;
        }
        sb.auth.updateUser({ password: nw }).then(function(ur) {
          setBusy(false);
          if (ur.error) {
            setMsg({ t: "err", m: ur.error.message });
            return;
          }
          setMsg({ t: "ok", m: "✅ Password changed!" });
          setCur(""); setNw(""); setCf("");
        });
      });
    });
  }

  function suggest() {
    var c = "abcdefghjkmnpqrstuvwxyz23456789";
    var r = "";
    for (var i = 0; i < 8; i++) c.charAt(Math.floor(Math.random() * c.length));
    for (var j = 0; j < 8; j++) r += c.charAt(Math.floor(Math.random() * c.length));
    var pwd = "pass@" + r;
    setNw(pwd);
    setCf(pwd);
  }

  return h("div", { className: "rounded-xl border p-6 bg-white" },
    h("div", { className: "font-black text-[15px] mb-4 uppercase" }, "🔑 CHANGE PASSWORD"),
    h("div", { className: "space-y-3" },
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "Current Password"),
        h("input", { type: "password", value: cur, onChange: function(e) { setCur(e.target.value); setMsg(null); }, placeholder: "Enter current password", className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold" })
      ),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "New Password"),
        h("div", { className: "flex gap-2" },
          h("input", { type: "password", value: nw, onChange: function(e) { setNw(e.target.value); setMsg(null); }, placeholder: "Enter new password", className: "flex-1 h-12 rounded-lg border px-4 text-[14px] font-bold" }),
          h("button", { type: "button", onClick: suggest, className: "h-12 px-4 rounded-lg bg-cyan-100 text-cyan-700 font-black text-[11px]" }, "🎲 Auto")
        )
      ),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase opacity-70 block mb-1.5" }, "Confirm Password"),
        h("input", { type: "password", value: cf, onChange: function(e) { setCf(e.target.value); setMsg(null); }, placeholder: "Re-enter new password", className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold" })
      ),
      msg ? h("div", { className: "p-3 rounded-lg text-[12px] font-bold " + (msg.t === "ok" ? "bg-green-50 border border-green-200 text-green-700" : "bg-red-50 border border-red-200 text-red-700") }, msg.m) : null,
      h("button", { onClick: change, disabled: busy, className: "w-full h-12 rounded-lg font-black text-[14px] bg-cyan-600 text-white " + (busy ? "opacity-50" : "") }, busy ? "Changing..." : "🔒 Change Password")
    )
  );
}

  }

    if (filterFrom) {
      var f1 = [];
      for (var i = 0; i < src.length; i++) if (src[i].date >= filterFrom) f1.push(src[i]);
      src = f1;
    }
    if (filterTo) {
      var f2 = [];
      for (var j = 0; j < src.length; j++) if (src[j].date <= filterTo) f2.push(src[j]);
      src = f2;
    }
    var dp = [], cp = [];
    for (var k = 0; k < parties.length; k++) {
      var p = parties[k];
      if (p.status !== "Active") continue;
      var bal = 0;
      for (var l = 0; l < src.length; l++) if (src[l].partyId === p.id) bal += src[l].amount;
      if (bal < 0) dp.push({ party: p, bal: bal });
      else if (bal > 0) cp.push({ party: p, bal: bal });
    }
    var debit = 0, credit = 0;
    for (var m = 0; m < dp.length; m++) debit += Math.abs(dp[m].bal);
    for (var n = 0; n < cp.length; n++) credit += cp[n].bal;
    var diff = credit - debit;
    var status = "BALANCED";
    if (diff > 0) status = "CREDIT EXCESS " + Math.abs(diff).toLocaleString("en-IN");
    else if (diff < 0) status = "DEBIT EXCESS " + Math.abs(diff).toLocaleString("en-IN");
    return { debitParties: dp, creditParties: cp, debit: debit, credit: credit, diff: diff, status: status };
  }, [ledgers, parties, filterFrom, filterTo]);

  function parseAmounts(s) {
    if (!s) return [];
    var parts = s.split("/");
    var nums = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i].trim());
      if (!isNaN(n) && n !== 0) nums.push(n);
    }
    if (nums.length === 0) {
      var nn = parseFloat(s);
      if (!isNaN(nn) && nn !== 0) nums.push(nn);
    }
    return nums;
  }

    var time = nowTime();
    var now = Date.now();
    var newEntries = [];

      newEntries.push({ id: "e_" + now + "_" + j + "_2", pairId: pairId, date: date, time: time, partyId: counter, counterPartyId: selectedParty, amount: -n, remark: finalRemark, createdAt: now + j * 2 + 1 });

  function saveModify() {

    if (isNaN(amt) || amt === 0) { showToast("Invalid amount"); return; }
    var finalRemark = (editForm.remark || "").trim();
    var newLedgers = [];
    for (var i = 0; i < ledgers.length; i++) {
      var e = ledgers[i];
      if (e.pairId !== editEntry.pairId) { newLedgers.push(e); continue; }
      if (isLocked(e)) { newLedgers.push(e); continue; }
      if (e.partyId === editEntry.partyId) {
        newLedgers.push({ id: e.id, pairId: e.pairId, date: editForm.date, time: e.time, partyId: e.partyId, counterPartyId: editForm.counter, amount: amt, remark: finalRemark, createdAt: e.createdAt });
      } else {
        newLedgers.push({ id: e.id, pairId: e.pairId, date: editForm.date, time: e.time, partyId: editForm.counter, counterPartyId: editEntry.partyId, amount: -amt, remark: finalRemark, createdAt: e.createdAt });

  function doFinal() {
    var entries = [];
    for (var i = 0; i < ledgers.length; i++) if (ledgers[i].partyId === selectedParty) entries.push(ledgers[i]);
    entries.sort(function(a, b) { return a.createdAt - b.createdAt; });
    var balance = 0;
    for (var j = 0; j < entries.length; j++) balance += entries[j].amount;
    var now = Date.now();
    var counterEntries = [];
    for (var k = 0; k < ledgers.length; k++) {
      var l = ledgers[k];
      if (l.counterPartyId === selectedParty && !l.openingLocked && (l.remark || "").toLowerCase() !== "opening" && !l.finalLocked) {
        counterEntries.push(l);
      }
    }
    var newFinals = finals.concat([{ id: "final_" + now, partyId: selectedParty, closedAt: todayISO(), entries: entries, counterEntries: counterEntries, balance: balance, createdAt: now }]);
    var cps = {};
    for (var m = 0; m < counterEntries.length; m++) cps[counterEntries[m].pairId] = true;
    var newLedgers = [];
    for (var n = 0; n < ledgers.length; n++) {
      var lg = ledgers[n];
      if (lg.partyId !== selectedParty) {
        if (cps[lg.pairId]) {
          var copy = {};
          for (var kk in lg) copy[kk] = lg[kk];
          copy.finalLocked = true;
          newLedgers.push(copy);
        } else {
          newLedgers.push(lg);
        }
      }
    }
    newLedgers.push({ id: "open_" + now, pairId: "opening_" + now, date: todayISO(), time: nowTime(), partyId: selectedParty, counterPartyId: "", amount: balance, remark: "Opening", createdAt: now + 5, openingLocked: true, carryForward: true });
    setFinals(newFinals);
    setLedgers(newLedgers);
    setConfirmFinal(false);
    saveNow({ ledgers: newLedgers, finals: newFinals });
    showToast(selectedParty + " Finalized");
  }

function MainApp() {
  var m1 = useState(null);
  var session = m1[0], setSession = m1[1];
  var m2 = useState(null);
  var profile = m2[0], setProfile = m2[1];
  var m3 = useState(false);
  var ready = m3[0], setReady = m3[1];
  var m4 = useState(null);
  var cloudState = m4[0], setCloudState = m4[1];
  var m5 = useState(null);
  var companyId = m5[0], setCompanyId = m5[1];
  var m6 = useState("idle");
  var saveStatus = m6[0], setSaveStatus = m6[1];

  useEffect(function() {
    sb.auth.getSession().then(function(r) {
      if (r.data.session) {
        setSession(r.data.session);
        loadAll(r.data.session);
      } else {
        setReady(true);
      }
    });
    var sub = sb.auth.onAuthStateChange(function(evt, sess) {
      if (evt === "SIGNED_OUT") {
        setSession(null); setProfile(null); setCloudState(null); setCompanyId(null); setReady(true);
      }
    });
    return function() { sub.data.subscription.unsubscribe(); };
  }, []);

  function loadAll(sess) {
    sb.from("profiles").select("*").eq("id", sess.user.id).single().then(function(pr) {
      if (!pr.data || !pr.data.company_id) {
        sb.auth.signOut();
        setReady(true);
        return;
      }
      setProfile(pr.data);
      setCompanyId(pr.data.company_id);
      var cid = pr.data.company_id;

      sb.from("company_state").select("state").eq("company_id", cid).maybeSingle().then(function(st) {
        var cloud = (st.data && st.data.state) ? st.data.state : null;
        var local = null;
        try {
          var raw = localStorage.getItem("ul_state_" + cid);
          if (raw) local = JSON.parse(raw);
        } catch(ex) {}

        var candidates = [];
        if (cloud && cloud.ledgers) candidates.push(cloud);
        if (local && local.ledgers) candidates.push(local);

        var final;
        if (candidates.length === 0) {
          final = { parties: SEED_PARTIES, ledgers: [], finals: [], history: [], companyName: "", pin: "", lastBackupTime: 0 };
        } else {
          candidates.sort(function(a, b) {
            return (b.ledgers.length || 0) - (a.ledgers.length || 0);
          });
          final = candidates[0];
        }
        setCloudState(final);
        setReady(true);
      });
    });
  }

  function saveCloud(newState) {
    if (!companyId || !session) return Promise.resolve();
    setSaveStatus("saving");
    return sb.from("company_state").upsert({
      company_id: companyId,
      state: newState,
      updated_at: new Date().toISOString(),
      updated_by: session.user.id
    }, { onConflict: "company_id" }).then(function(r) {
      if (r.error) {
        console.error("Save failed", r.error);
        setSaveStatus("error");
        return;
      }
      setSaveStatus("saved");
      setTimeout(function() { setSaveStatus("idle"); }, 1500);
    });
  }

  if (!ready) {
    return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
      h("div", { className: "text-center" },
        h("div", { className: "text-[40px] mb-3" }, "📒"),
        h("div", { className: "text-[15px] font-black text-slate-700" }, "Loading...")
      )
    );
  }

  if (!session || !profile) {
    return h(LoginScreen, { onLogin: function(sess) {
      setSession(sess);
      loadAll(sess);
    }});
  }

  return h(OriginalApp, {
    session: session,
    profile: profile,
    companyId: companyId,
    cloudState: cloudState,
    saveCloud: saveCloud,
    cloudSaveStatus: saveStatus,
    onLogout: function() { sb.auth.signOut(); }
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
</script>
</body>
