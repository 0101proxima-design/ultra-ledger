        setBusy(false);
        return;

}

function ChangePasswordCard({ T }) {
  const [cur, setCur] = useState("");
  const [nw, setNw] = useState("");
  const [cf, setCf] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  function change() {
    setMsg(null);
    if (!cur) { setMsg({ t: "err", m: "Current password required" }); return; }
    if (!nw || nw.length < 6) { setMsg({ t: "err", m: "New password min 6 characters" }); return; }
    if (nw !== cf) { setMsg({ t: "err", m: "Passwords do not match" }); return; }
    setBusy(true);
    sb.auth.getUser().then(function(r) {
      if (!r.data.user || !r.data.user.email) {
        setMsg({ t: "err", m: "Session expired" });
        setBusy(false);
        return;
      }
      sb.auth.signInWithPassword({ email: r.data.user.email, password: cur }).then(function(vr) {
        if (vr.error) {
          setMsg({ t: "err", m: "Current password is wrong" });
          setBusy(false);
          return;
        }
        sb.auth.updateUser({ password: nw }).then(function(ur) {
          setBusy(false);
          if (ur.error) { setMsg({ t: "err", m: ur.error.message }); return; }
          setMsg({ t: "ok", m: "✅ Password changed!" });
          setCur("");
          setNw("");
          setCf("");
        });
      });
    });
  }

  function suggest() {
    var c = "abcdefghjkmnpqrstuvwxyz23456789";
    var r = "";
    for (var i = 0; i < 8; i++) r += c[Math.floor(Math.random() * c.length)];
    var p = "pass@" + r;
    setNw(p);
    setCf(p);
  }

  return h("div", { className: "rounded-xl border p-6 " + T.card },
    h("div", { className: "font-black text-[15px] mb-4 uppercase tracking-wide" }, "🔑 CHANGE PASSWORD"),
    h("div", { className: "space-y-3" },
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "Current Password"),
        h("input", { type: "password", value: cur, onChange: function(e) { setCur(e.target.value); setMsg(null); }, placeholder: "Enter current password", className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input })
      ),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "New Password (min 6 chars)"),
        h("div", { className: "flex gap-2" },
          h("input", { type: "password", value: nw, onChange: function(e) { setNw(e.target.value); setMsg(null); }, placeholder: "Enter new password", className: "flex-1 h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input }),
          h("button", { type: "button", onClick: suggest, className: "h-12 px-4 rounded-lg bg-cyan-100 text-cyan-700 font-black text-[11px]" }, "🎲 Auto")
        )
      ),
      h("div", null,
        h("label", { className: "text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "Confirm New Password"),
        h("input", { type: "password", value: cf, onChange: function(e) { setCf(e.target.value); setMsg(null); }, placeholder: "Re-enter new password", className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold " + T.input })
      ),
      msg && h("div", { className: "p-3 rounded-lg text-[12px] font-bold " + (msg.t === "ok" ? "bg-green-50 border border-green-200 text-green-700" : "bg-red-50 border border-red-200 text-red-700") }, msg.m),
      h("button", { onClick: change, disabled: busy, className: "w-full h-12 rounded-lg font-black text-[14px] " + (busy ? "opacity-50 " : "") + T.addBtn }, busy ? "Changing..." : "🔒 Change Password")
    )

function MainApp() {
  const [ready, setReady] = useState(false);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [companyId, setCompanyId] = useState(null);
  const [initialState, setInitialState] = useState(null);
  const [saveStatus, setSaveStatus] = useState("idle");

  useEffect(function() {
    sb.auth.getSession().then(function(r) {
      if (r.data.session) {
        setSession(r.data.session);
        loadAll(r.data.session);
      } else {
        setReady(true);
      }
    });
    var sub = sb.auth.onAuthStateChange(function(evt, sess) {
      if (evt === "SIGNED_OUT") {
        setSession(null);
        setProfile(null);
        setCompanyId(null);
        setInitialState(null);
        setReady(true);
      }
    });
    return function() { sub.data.subscription.unsubscribe(); };
  }, []);

  function loadAll(sess) {
    sb.from("profiles").select("*").eq("id", sess.user.id).single().then(function(pr) {
      if (!pr.data || !pr.data.company_id) {
        sb.auth.signOut();
        setReady(true);
        return;
      }
      setProfile(pr.data);
      setCompanyId(pr.data.company_id);
      var cid = pr.data.company_id;

      sb.from("companies").select("name").eq("id", cid).single().then(function(co) {
        var compName = (co.data && co.data.name) || "";
        sb.from("company_state").select("state").eq("company_id", cid).maybeSingle().then(function(st) {
          var cloud = (st.data && st.data.state) ? st.data.state : null;
          var local = null;
          try {
            var raw = localStorage.getItem("ul_state_" + cid);
            if (raw) local = JSON.parse(raw);
          } catch(e) {}

          var candidates = [];
          if (cloud && cloud.ledgers) candidates.push(cloud);
          if (local && local.ledgers) candidates.push(local);

          var final;
          if (candidates.length === 0) {
            final = { parties: SEED_PARTIES, ledgers: [], finals: [], history: [], companyName: compName, theme: "ocean", pin: "", lastBackupTime: 0 };
          } else {
            candidates.sort(function(a, b) { return (b.ledgers.length || 0) - (a.ledgers.length || 0); });
            final = candidates[0];
            if (!final.companyName && compName) final.companyName = compName;
            if (!final.theme) final.theme = "ocean";
          }
          setInitialState(final);
          setReady(true);
        });
      });
    });
  }

  function saveCloud(newState) {
    if (!companyId || !session) return Promise.resolve();
    setSaveStatus("saving");
    return sb.from("company_state").upsert({
      company_id: companyId,
      state: newState,
      updated_at: new Date().toISOString(),
      updated_by: session.user.id
    }, { onConflict: "company_id" }).then(function(r) {
      if (r.error) {
        console.error(r.error);
        setSaveStatus("error");
        return;
      }
      setSaveStatus("saved");
      setTimeout(function() { setSaveStatus("idle"); }, 1500);
    });
  }

  if (!ready) {
    return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
      h("div", { className: "text-center" },
        h("div", { className: "text-[40px] mb-3" }, "📒"),
        h("div", { className: "text-[15px] font-black" }, "Loading...")
      )
    );
  }

  if (!session || !profile) {
    return h(LoginScreen, { onLogin: function(s) { setReady(false); setSession(s); loadAll(s); } });
  }

  return h(Dashboard, {
    session: session,
    profile: profile,
    companyId: companyId,
    initialState: initialState,
    saveCloud: saveCloud,
    saveStatus: saveStatus,
    onLogout: function() { sb.auth.signOut(); }
  });
}

function Dashboard({ session, profile, companyId, initialState, saveCloud, saveStatus, onLogout }) {
  const [tab, setTab] = useState("ledger");
  const [theme, setTheme] = useState(initialState.theme || "ocean");
  const [companyName, setCompanyName] = useState(initialState.companyName || "");

  const [finals, setFinals] = useState(initialState.finals || []);

  const [selectedParty, setSelectedParty] = useState("BB");
  const [counter, setCounter] = useState("AA");
  const [amount, setAmount] = useState("");
  const [remark, setRemark] = useState("");
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [editEntry, setEditEntry] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [deleteEntry, setDeleteEntry] = useState(null);
  const [confirmFinal, setConfirmFinal] = useState(false);
  const [lockedInfo, setLockedInfo] = useState(null);
  const [pinInput, setPinInput] = useState("");
  const [pinMsg, setPinMsg] = useState("");
  const [companyNameInput, setCompanyNameInput] = useState(initialState.companyName || "");
  const [newPartyName, setNewPartyName] = useState("");
  const [partyConfirm, setPartyConfirm] = useState(null);
  const [editParty, setEditParty] = useState(null);
  const [editPartyName, setEditPartyName] = useState("");
  const [toggleConfirm, setToggleConfirm] = useState(null);
  const [filterFrom, setFilterFrom] = useState("");
  const [filterTo, setFilterTo] = useState("");
  const [finalFilter, setFinalFilter] = useState("");
  const [frOpen, setFrOpen] = useState(false);
  const [frSearch, setFrSearch] = useState("");
  const [pinPrompt, setPinPrompt] = useState(null);
  const [pinPromptInput, setPinPromptInput] = useState("");
  const [pinPromptErr, setPinPromptErr] = useState("");
  const [showCols, setShowCols] = useState({ date: true, counter: true, remark: true, debit: true, credit: true, balance: true, action: true });
  const [showColDropdown, setShowColDropdown] = useState(false);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [historyFilter, setHistoryFilter] = useState("All");

  const amountRef = useRef(null);
  const remarkRef = useRef(null);
  const counterRef = useRef(null);
  const addBtnRef = useRef(null);
  const fileInputRef = useRef(null);
  const saveTimer = useRef(null);
  const skipSave = useRef(true);

  useEffect(function() {
    setTimeout(function() { skipSave.current = false; }, 1500);
  }, []);

  useEffect(function() {
    if (skipSave.current) return;
    var snap = { parties: parties, ledgers: ledgers, finals: finals, pin: pin, theme: theme, companyName: companyName, history: history, lastBackupTime: lastBackup, selectedParty: selectedParty, counter: counter, savedAt: Date.now() };
    try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(snap)); } catch(e) {}
  }, [parties, ledgers, finals, pin, theme, companyName, history, lastBackup, selectedParty, counter, companyId]);

  useEffect(function() {
    if (skipSave.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      if (saveCloud) saveCloud({ parties: parties, ledgers: ledgers, finals: finals, pin: pin, theme: theme, companyName: companyName, history: history, lastBackupTime: lastBackup, selectedParty: selectedParty, counter: counter, savedAt: Date.now() });
    }, 500);
    return function() { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [parties, ledgers, finals, pin, theme, companyName, history, lastBackup, selectedParty, counter]);

  useEffect(function() {
    if (toast) {
      var t = setTimeout(function() { setToast(null); }, 2500);
      return function() { clearTimeout(t); };
    }
  }, [toast]);

  var T = THEMES[theme] || THEMES.ocean;

  function notify(m) { setToast(m); }

  function saveNow(updates) {
    var ns = {
      parties: updates.parties !== undefined ? updates.parties : parties,
      ledgers: updates.ledgers !== undefined ? updates.ledgers : ledgers,
      finals: updates.finals !== undefined ? updates.finals : finals,
      pin: updates.pin !== undefined ? updates.pin : pin,
      theme: updates.theme !== undefined ? updates.theme : theme,
      companyName: updates.companyName !== undefined ? updates.companyName : companyName,
      history: updates.history !== undefined ? updates.history : history,
      lastBackupTime: updates.lastBackupTime !== undefined ? updates.lastBackupTime : lastBackup,
      selectedParty: updates.selectedParty !== undefined ? updates.selectedParty : selectedParty,
      counter: updates.counter !== undefined ? updates.counter : counter,
      savedAt: Date.now()
    };
    try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(ns)); } catch(e) {}
    if (saveCloud) saveCloud(ns);
  }

  function logout() {
    var snap = { parties: parties, ledgers: ledgers, finals: finals, pin: pin, theme: theme, companyName: companyName, history: history, lastBackupTime: lastBackup, selectedParty: selectedParty, counter: counter, savedAt: Date.now() };
    try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(snap)); } catch(e) {}
    if (saveCloud) {
      saveCloud(snap).then(function() { setTimeout(function() { onLogout(); }, 400); });
    } else {
      onLogout();
    }
  }

  function requirePin(fn, label) {
    if (!pin) { fn(); return; }
    setPinPrompt({ run: fn, label: label || "Confirm" });
    setPinPromptInput("");
    setPinPromptErr("");
  }

  function confirmPin() {
    if (pinPromptInput === pin) {
      var fn = pinPrompt.run;
      setPinPrompt(null);
      setPinPromptInput("");
      setPinPromptErr("");
      setTimeout(fn, 50);
    } else {
      setPinPromptErr("Wrong PIN");
    }
  }

  function parseAmounts(s) {
    if (!s) return [];
    var parts = s.split("/");
    var nums = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i].trim());
      if (!isNaN(n) && n !== 0) nums.push(n);
    }
    if (nums.length === 0) {
      var nn = parseFloat(s);
      if (!isNaN(nn) && nn !== 0) nums.push(nn);
    }
    return nums;
  }

  function addEntry() {
    var nums = parseAmounts(amount);
    if (!nums.length) { notify("Enter amount"); return; }
    if (selectedParty === counter) { notify("Same party not allowed"); return; }
    var cp = null;
    for (var i = 0; i < parties.length; i++) if (parties[i].id === counter) cp = parties[i];
    if (!cp || cp.status !== "Active") { notify("Counter inactive"); return; }

    var t = Date.now();
    var date = today();
    var time = nowT();
    var newEntries = [];
    var finalRemark = remark.trim();

    for (var j = 0; j < nums.length; j++) {
      var n = nums[j];
      var pid = "pair_" + t + "_" + j;
      newEntries.push({ id: "e_" + t + "_" + j + "_a", pairId: pid, date: date, time: time, partyId: selectedParty, counterPartyId: counter, amount: n, remark: finalRemark, createdAt: t + j * 2 });
      newEntries.push({ id: "e_" + t + "_" + j + "_b", pairId: pid, date: date, time: time, partyId: counter, counterPartyId: selectedParty, amount: -n, remark: finalRemark, createdAt: t + j * 2 + 1 });
    }

    var newLedgers = ledgers.concat(newEntries);
    setLedgers(newLedgers);
    setAmount("");
    setRemark("");
    saveNow({ ledgers: newLedgers });
    notify("Added");
    setTimeout(function() { if (counterRef.current) counterRef.current.focus(); }, 50);
  }

  function openEdit(e) {
    if (e.openingLocked || (e.remark || "").toLowerCase() === "opening" || e.finalLocked) {
      setLockedInfo({ reason: "Entry is locked" });
      return;
    }
    setEditEntry(e);
    setEditForm({ date: e.date, counter: e.counterPartyId, amount: String(e.amount), remark: e.remark || "" });
  }

  function saveEdit() {
    var amt = parseFloat(editForm.amount);
    if (isNaN(amt) || amt === 0) { notify("Invalid amount"); return; }
    var finalRemark = (editForm.remark || "").trim();
    var newLedgers = [];
    for (var i = 0; i < ledgers.length; i++) {
      var e = ledgers[i];
      if (e.pairId !== editEntry.pairId) { newLedgers.push(e); continue; }
      if (e.openingLocked || (e.remark || "").toLowerCase() === "opening" || e.finalLocked) { newLedgers.push(e); continue; }
      if (e.partyId === editEntry.partyId) {
        newLedgers.push({ id: e.id, pairId: e.pairId, date: editForm.date, time: e.time, partyId: e.partyId, counterPartyId: editForm.counter, amount: amt, remark: finalRemark, createdAt: e.createdAt });
      } else {
        newLedgers.push({ id: e.id, pairId: e.pairId, date: editForm.date, time: e.time, partyId: editForm.counter, counterPartyId: editEntry.partyId, amount: -amt, remark: finalRemark, createdAt: e.createdAt });
      }
    }
    setLedgers(newLedgers);
    setEditEntry(null);
    saveNow({ ledgers: newLedgers });
    notify("Modified");
  }

  function openDelete(e) {
    if (e.openingLocked || (e.remark || "").toLowerCase() === "opening" || e.finalLocked) {
      setLockedInfo({ reason: "Entry is locked" });
      return;
    }
    setDeleteEntry(e);
  }

  function doDelete() {
    var pairId = deleteEntry.pairId;
    var id = deleteEntry.id;
    var newLedgers = [];
    for (var i = 0; i < ledgers.length; i++) {
      var e = ledgers[i];
      if (e.openingLocked || (e.remark || "").toLowerCase() === "opening" || e.finalLocked) { newLedgers.push(e); continue; }
      if (e.pairId && pairId) { if (e.pairId !== pairId) newLedgers.push(e); }
      else { if (e.id !== id) newLedgers.push(e); }
    }
    setLedgers(newLedgers);
    setDeleteEntry(null);
    saveNow({ ledgers: newLedgers });
    notify("Deleted");
  }

  function requestFinal() { requirePin(function() { setConfirmFinal(true); }, "FINAL Closing"); }

  function doFinal() {
    var entries = [];
    for (var i = 0; i < ledgers.length; i++) if (ledgers[i].partyId === selectedParty) entries.push(ledgers[i]);
    entries.sort(function(a, b) { return a.createdAt - b.createdAt; });
    var balance = 0;
    for (var j = 0; j < entries.length; j++) balance += entries[j].amount;

    var t = Date.now();
    var counterEntries = [];
    for (var k = 0; k < ledgers.length; k++) {
      var l = ledgers[k];
      if (l.counterPartyId === selectedParty && !l.openingLocked && (l.remark || "").toLowerCase() !== "opening" && !l.finalLocked) counterEntries.push(l);
    }

    var newFinal = { id: "final_" + t, partyId: selectedParty, closedAt: today(), entries: entries, counterEntries: counterEntries, balance: balance, createdAt: t };
    var newFinals = finals.concat([newFinal]);

    var cps = {};
    for (var m = 0; m < counterEntries.length; m++) cps[counterEntries[m].pairId] = true;

    var newLedgers = [];
    for (var n = 0; n < ledgers.length; n++) {
      var lg = ledgers[n];
      if (lg.partyId !== selectedParty) {
        if (cps[lg.pairId]) {
          var copy = {};
          for (var kk in lg) copy[kk] = lg[kk];
          copy.finalLocked = true;
          newLedgers.push(copy);
        } else {
          newLedgers.push(lg);
        }
      }
    }
    newLedgers.push({ id: "open_" + t, pairId: "opening_" + t, date: today(), time: nowT(), partyId: selectedParty, counterPartyId: "", amount: balance, remark: "Opening", createdAt: t + 5, openingLocked: true, carryForward: true });

    setFinals(newFinals);
    setLedgers(newLedgers);
    setConfirmFinal(false);
    saveNow({ ledgers: newLedgers, finals: newFinals });
    notify(selectedParty + " Finalized");
  }

  function downloadBlob(blob, name) {

    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

      h("div", { key: "b", className: "flex gap-2" },
        h("button", { onClick: function() { setPartyConfirm(null); }, className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
        h("button", { onClick: confirmAddParty, className: "flex-1 h-11 rounded-lg font-black " + T.addBtn }, "Create")
      )
    ], function() { setPartyConfirm(null); }),

    toggleConfirm && modal([
      h("div", { key: "t", className: "font-black text-[15px] mb-3" }, toggleConfirm.next + " " + toggleConfirm.party.id + "?"),
      h("p", { key: "p", className: "text-[13px] mb-4" }, "Balance " + fmt(allPartyBalances[toggleConfirm.party.id] || 0)),
      h("div", { key: "b", className: "flex gap-2" },
        h("button", { onClick: function() { setToggleConfirm(null); }, className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "No"),
        h("button", { onClick: confirmToggle, className: "flex-1 h-11 rounded-lg font-black " + (toggleConfirm.next === "Deactive" ? "bg-red-600 text-white" : T.addBtn) }, "Yes")
      )
    ], function() { setToggleConfirm(null); }),

    editParty && modal([
      h("div", { key: "t", className: "font-black text-[15px] mb-3" }, "Modify Party - " + editParty.id),
      h("input", { key: "i", value: editPartyName, onChange: function(e) { setEditPartyName(e.target.value.toUpperCase()); }, className: "w-full h-11 rounded-lg border px-3 text-[15px] font-black " + T.input }),
      h("div", { key: "b", className: "flex gap-2 mt-3" },
        h("button", { onClick: function() { setEditParty(null); }, className: "flex-1 h-11 rounded-lg border font-bold " + T.exportBtnAlt }, "Cancel"),
        h("button", { onClick: saveEditParty, className: "flex-1 h-11 rounded-lg font-black " + T.addBtn }, "Save")
      )
    ], function() { setEditParty(null); }),

    frOpen && h("div", { className: "fixed inset-0 z-[90] bg-black/70 flex items-center justify-center p-4", onClick: function() { setFrOpen(false); } },
      h("div", { className: "w-full max-w-[1100px] rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] " + T.card, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "px-4 py-3 flex justify-between items-center", style: { background: "linear-gradient(90deg,#0369a1,#0891b2)" } },
          h("div", { className: "flex items-center gap-3 text-white" },
            h("span", { className: "text-[20px]" }, "📄"),
            h("div", null,
              h("div", { className: "font-black text-[15px] tracking-wide" }, "FINAL REPORT - " + selectedParty),
              h("div", { className: "text-[11px] opacity-90 font-bold" }, "Groups: " + frSummary.totalGroups + " | Rows: " + frSummary.totalRows + " | Closing: " + fmt(frSummary.closingBal))
            )
          ),
          h("button", { onClick: function() { setFrOpen(false); }, className: "w-8 h-8 rounded-lg bg-white/20 text-white font-black" }, "✕")
        ),
        h("div", { className: "px-3 py-2 border-b flex justify-between items-center flex-wrap gap-2 " + T.card },
          h("input", { value: frSearch, onChange: function(e) { setFrSearch(e.target.value); }, placeholder: "Search...", className: "h-9 w-[280px] rounded-lg border px-3 text-[12.5px] " + T.input }),
          h("div", { className: "flex gap-2 items-center" },
            frSearch && h("button", { onClick: function() { setFrSearch(""); }, className: "h-9 px-3 rounded-lg border text-[12px] font-bold " + T.exportBtnAlt }, "✕"),
            h("span", { className: "text-[11px] font-black opacity-60 px-2" }, frRows.length + " rows"),
            h("button", { onClick: exportFRExcel, className: "h-9 px-4 rounded-lg text-[13px] font-black bg-emerald-600 text-white" }, "📊 Excel")
          )
        ),
        h("div", { className: "overflow-auto flex-1" },
          h("table", { className: "w-full", style: { fontSize: "13px" } },
            h("thead", { className: "sticky top-0 z-[5] " + T.tableHeader },
              h("tr", null, ["Date", "Counter", "Remark", "Debit", "Credit", "Balance"].map(function(hd) {
                return h("th", { key: hd, className: "py-1.5 px-2.5 text-left font-black text-[11px] uppercase" }, hd);
              }))
            ),
            h("tbody", null,
              frRows.length === 0 && h("tr", null, h("td", { colSpan: 6, className: "p-8 text-center opacity-60 font-bold" }, "No FINAL records")),
              frRows.map(function(r) {
                return h("tr", { key: r.id, className: "border-t " + (r.isClosing ? "bg-cyan-300 font-bold" : r.isOpeningEntry ? "bg-amber-50" : "") },
                  h("td", { className: "py-0.5 px-2.5 font-mono text-[12px]" }, dmy(r.date)),
                  h("td", { className: "py-0.5 px-2.5 font-bold" }, r.counterPartyId || "-"),
                  h("td", { className: "py-0.5 px-2.5 font-semibold" }, r.remark || "-"),
                  h("td", { className: "py-0.5 px-2 text-right font-mono" }, r._debit === "-" ? "-" : fmtAbs(r._debit)),
                  h("td", { className: "py-0.5 px-2 text-right font-mono" }, r._credit === "-" ? "-" : fmt(r._credit)),
                  h("td", { className: "py-0.5 px-2 text-right font-mono font-black " + (r._bal < 0 ? "text-red-600" : "text-green-600") }, fmt(r._bal))
                );
              })
            )
          )
        )
      )
    ),

    historyOpen && h("div", { className: "fixed inset-0 z-[80] bg-black/60 flex items-center justify-center p-4", onClick: function() { setHistoryOpen(false); } },
      h("div", { className: "w-full max-w-5xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] " + T.card, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "bg-gray-900 text-white px-4 py-3 flex justify-between" },
          h("div", { className: "font-black text-[14px] uppercase" }, "PARTY HISTORY"),
          h("button", { onClick: function() { setHistoryOpen(false); }, className: "w-7 h-7 rounded bg-white/20 font-bold" }, "✕")
        ),
        h("div", { className: "px-3 py-2 border-b flex justify-between" },
          h("select", { value: historyFilter, onChange: function(e) { setHistoryFilter(e.target.value); }, className: "h-8 rounded border px-2 text-[12px] font-bold " + T.input },
            h("option", null, "All"),
            parties.map(function(p) { return h("option", { key: p.id }, p.id); })
          ),
          h("button", { onClick: exportHistory, className: "h-8 px-3 rounded text-[12px] font-black bg-slate-900 text-white" }, "Export")
        ),
        h("div", { className: "overflow-auto flex-1" },
          h("table", { className: "w-full", style: { fontSize: "13px" } },
            h("thead", { className: T.tableHeader },
              h("tr", null, ["Date", "Time", "Action", "Party", "Old", "New", "Remark"].map(function(x) {
                return h("th", { key: x, className: "py-1.5 px-2.5 text-left font-black text-[11px] uppercase" }, x);
              }))
            ),
            h("tbody", null, (historyFilter === "All" ? history : history.filter(function(x) { return x.partyId === historyFilter || x.oldVal === historyFilter || x.newVal === historyFilter; })).map(function(x) {
              return h("tr", { key: x.id, className: "border-t" },
                h("td", { className: "py-1.5 px-2.5 font-mono text-[12px] font-bold" }, x.dateDisplay),
                h("td", { className: "py-1.5 px-2.5 font-bold" }, x.timeDisplay),
                h("td", { className: "py-1.5 px-2.5" }, h("span", { className: "px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-[11px] font-black" }, x.action)),
                h("td", { className: "py-1.5 px-2.5 font-black text-[13px]" }, x.partyId),
                h("td", { className: "py-1.5 px-2.5 font-mono font-bold text-[12px]" }, x.oldVal),
                h("td", { className: "py-1.5 px-2.5 font-mono font-bold text-[12px]" }, x.newVal),
                h("td", { className: "py-1.5 px-2.5 font-semibold truncate max-w-[200px]" }, x.remark)
              );
            }))
          )
        )
      )
    ),

    pinPrompt && h("div", { className: "fixed inset-0 z-[95] bg-black/70 flex items-center justify-center p-4", onClick: function() { setPinPrompt(null); } },
      h("div", { className: "w-full max-w-[400px] rounded-xl bg-white shadow-2xl p-5 flex flex-col gap-3", onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px]" }, "🔐 PIN Required"),
        h("div", { className: "text-[12px] text-gray-600" }, "Confirm: " + pinPrompt.label),
        h("input", { type: "password", autoFocus: true, maxLength: 6, value: pinPromptInput, onChange: function(e) { setPinPromptInput(e.target.value.replace(/[^0-9]/g, "")); setPinPromptErr(""); }, onKeyDown: function(e) { if (e.key === "Enter") { e.preventDefault(); confirmPin(); } }, placeholder: "Enter PIN", className: "w-full h-12 rounded-lg border-2 px-4 text-[18px] font-black tracking-widest text-center" }),
        pinPromptErr && h("div", { className: "text-[12px] text-red-600 text-center font-bold" }, pinPromptErr),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: function() { setPinPrompt(null); }, className: "flex-1 h-11 rounded-lg border font-black" }, "Cancel"),
          h("button", { onClick: confirmPin, className: "flex-1 h-11 rounded-lg bg-black text-white font-black" }, "Confirm")
        )
      )
    ),

    toast && h("div", { className: "fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-full bg-black text-white text-[14px] font-black shadow-2xl" }, "✓ " + toast)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
</script>
</body>
</html>
