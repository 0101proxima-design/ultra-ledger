<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA LEDGER</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;

var SB_URL = "https://kzgqsjbayluqyhjhytkt.supabase.co";
var SB_KEY = "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ";
var sb = supabase.createClient(SB_URL, SB_KEY);
var DOMAIN = "@ultraledger.local";

function App() {
  var a1 = useState(null); var session = a1[0], setSession = a1[1];
  var a2 = useState(null); var profile = a2[0], setProfile = a2[1];
  var a3 = useState(false); var ready = a3[0], setReady = a3[1];
  var a4 = useState(""); var u = a4[0], setU = a4[1];
  var a5 = useState(""); var p = a5[0], setP = a5[1];
  var a6 = useState(""); var err = a6[0], setErr = a6[1];
  var a7 = useState(true); var loading = a7[0], setLoading = a7[1];
  var a8 = useState([]); var parties = a8[0], setParties = a8[1];
  var a9 = useState([]); var ledgers = a9[0], setLedgers = a9[1];
  var a10 = useState(""); var selectedParty = a10[0], setSelectedParty = a10[1];
  var a11 = useState(""); var counter = a11[0], setCounter = a11[1];
  var a12 = useState(""); var amount = a12[0], setAmount = a12[1];
  var a13 = useState(""); var remark = a13[0], setRemark = a13[1];
  var a14 = useState(""); var status = a14[0], setStatus = a14[1];
  var a15 = useState(null); var companyId = a15[0], setCompanyId = a15[1];
  var a16 = useState(""); var companyName = a16[0], setCompanyName = a16[1];

  var saveTimer = useRef(null);
  var skipSave = useRef(true);

  useEffect(function() {
    sb.auth.getSession().then(function(r) {
      if (r.data.session) {
        setSession(r.data.session);
        sb.from("profiles").select("*").eq("id", r.data.session.user.id).single().then(function(pr) {
          if (pr.data) setProfile(pr.data);
          setReady(true);
        });
      } else {
        setReady(true);
      }
    });
    var sub = sb.auth.onAuthStateChange(function(evt, sess) {
      if (evt === "SIGNED_OUT") { setSession(null); setProfile(null); }
    });
    return function() { sub.data.subscription.unsubscribe(); };
  }, []);

  useEffect(function() {
    if (!session || !profile || !profile.company_id) return;
    setLoading(true);
    var cid = profile.company_id;
    setCompanyId(cid);
    sb.from("companies").select("name").eq("id", cid).single().then(function(co) {
      if (co.data) setCompanyName(co.data.name);
    });
    sb.from("company_state").select("state").eq("company_id", cid).maybeSingle().then(function(st) {
      var cloud = (st.data && st.data.state) ? st.data.state : null;
      var local = null;
      try {
        var raw = localStorage.getItem("ul_state_" + cid);
        if (raw) local = JSON.parse(raw);
      } catch(ex) {}
      var candidates = [];
      if (cloud && cloud.ledgers) candidates.push(cloud);
      if (local && local.ledgers) candidates.push(local);
      var final;
      if (candidates.length === 0) {
        final = { parties: [{id:"AA",name:"AA",status:"Active"},{id:"BB",name:"BB",status:"Active"}], ledgers: [] };
      } else {
        candidates.sort(function(a, b) { return (b.ledgers.length || 0) - (a.ledgers.length || 0); });
        final = candidates[0];
      }
      setParties(final.parties || []);
      setLedgers(final.ledgers || []);
      if (final.parties && final.parties.length > 0) {
        setSelectedParty(final.parties[0].id);
        if (final.parties.length > 1) setCounter(final.parties[1].id);
      }
      setLoading(false);
      setTimeout(function() { skipSave.current = false; }, 1000);
    });
  }, [session, profile]);

  useEffect(function() {
    if (loading || skipSave.current || !companyId) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      var st = { parties: parties, ledgers: ledgers, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(st)); } catch(ex) {}
      setStatus("saving");
      sb.from("company_state").upsert({
        company_id: companyId,
        state: st,
        updated_at: new Date().toISOString(),
        updated_by: session.user.id
      }, { onConflict: "company_id" }).then(function(r) {
        if (r.error) { setStatus("error"); return; }
        setStatus("saved");
        setTimeout(function() { setStatus(""); }, 1500);
      });
    }, 400);
    return function() { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [parties, ledgers, loading, companyId]);

  function doLogin(ev) {
    ev.preventDefault();
    setErr("");
    var uname = u.trim().toLowerCase();
    sb.from("profiles").select("username, company_id").eq("username", uname).maybeSingle().then(function(pr) {
      if (!pr.data || !pr.data.company_id) { setErr("Username not found"); return; }
      sb.from("companies").select("code").eq("id", pr.data.company_id).single().then(function(co) {
        if (!co.data) { setErr("Company not found"); return; }
        var email = uname + "." + co.data.code.toLowerCase() + DOMAIN;
        sb.auth.signInWithPassword({ email: email, password: p }).then(function(r) {
          if (r.error) { setErr("Wrong username or password"); return; }
          setSession(r.data.session);
          sb.from("profiles").select("*").eq("id", r.data.session.user.id).single().then(function(pr2) {
            if (pr2.data) setProfile(pr2.data);
          });
        });
      });
    });
  }

  function doLogout() {
    if (companyId) {
      var st = { parties: parties, ledgers: ledgers, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(st)); } catch(ex) {}
      sb.from("company_state").upsert({
        company_id: companyId,
        state: st,
        updated_at: new Date().toISOString(),
        updated_by: session.user.id
      }, { onConflict: "company_id" }).then(function() {
        sb.auth.signOut();
      });
    } else {
      sb.auth.signOut();
    }
  }

  function addEntry() {
    if (!amount || !counter || !selectedParty) return;
    if (selectedParty === counter) return alert("Same party");
    var parts = amount.split("/");
    var nums = [];
    for (var i = 0; i < parts.length; i++) {
      var n = parseFloat(parts[i].trim());
      if (!isNaN(n) && n !== 0) nums.push(n);
    }
    if (nums.length === 0) return alert("Invalid amount");
    var now = Date.now();
    var dt = new Date();
    var date = dt.toISOString().slice(0, 10);
    var time = String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0");
    var newEntries = [];
    for (var j = 0; j < nums.length; j++) {
      var nn = nums[j];
      var pid = "pair_" + now + "_" + j;
      newEntries.push({ id: "e_" + now + "_" + j + "_1", pairId: pid, date: date, time: time, partyId: selectedParty, counterPartyId: counter, amount: nn, remark: remark.trim(), createdAt: now + j * 2 });
      newEntries.push({ id: "e_" + now + "_" + j + "_2", pairId: pid, date: date, time: time, partyId: counter, counterPartyId: selectedParty, amount: -nn, remark: remark.trim(), createdAt: now + j * 2 + 1 });
    }
    setLedgers(ledgers.concat(newEntries));
    setAmount("");
    setRemark("");
  }

  function deleteEntry(entry) {
    if (entry.openingLocked) return;
    if (!confirm("Delete from both sides?")) return;
    var newList = [];
    for (var i = 0; i < ledgers.length; i++) {
      if (ledgers[i].pairId !== entry.pairId) newList.push(ledgers[i]);
    }
    setLedgers(newList);
  }

  if (!ready) return h("div", { className: "min-h-screen flex items-center justify-center" }, "Loading...");

  if (!session) {
    return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
      h("form", { onSubmit: doLogin, className: "bg-white p-8 rounded-2xl shadow-xl w-96" },
        h("div", { className: "text-center text-[32px] mb-4" }, "📒 ULTRA LEDGER"),
        h("input", { value: u, onChange: function(e) { setU(e.target.value); }, placeholder: "Username", className: "w-full h-12 rounded border px-4 mb-3" }),
        h("input", { type: "password", value: p, onChange: function(e) { setP(e.target.value); }, placeholder: "Password", className: "w-full h-12 rounded border px-4 mb-3" }),
        err ? h("div", { className: "text-red-600 mb-3 text-[12px]" }, err) : null,
        h("button", { className: "w-full h-12 bg-cyan-600 text-white rounded font-bold" }, "LOGIN")
      )
    );
  }

  if (loading) return h("div", { className: "min-h-screen flex items-center justify-center" }, "Loading ledger...");

  var partyRows = [];
  for (var i = 0; i < ledgers.length; i++) {
    if (ledgers[i].partyId === selectedParty) partyRows.push(ledgers[i]);
  }
  partyRows.sort(function(a, b) { return a.createdAt - b.createdAt; });

  var balMap = {};
  var running = 0;
  for (var k = 0; k < partyRows.length; k++) {
    running += partyRows[k].amount;
    balMap[partyRows[k].id] = running;
  }
  var totalBalance = running;

  var rows = [];
  for (var r = 0; r < partyRows.length; r++) {
    (function(entry) {
      var bal = balMap[entry.id] || 0;
      rows.push(
        h("tr", { key: entry.id, className: "border-t" },
          h("td", { className: "p-2 text-[12px]" }, entry.date + " " + entry.time),
          h("td", { className: "p-2 font-bold" }, entry.counterPartyId || "-"),
          h("td", { className: "p-2" }, entry.remark || "-"),
          h("td", { className: "p-2 text-right text-red-600" }, entry.amount < 0 ? "₹" + Math.abs(entry.amount).toLocaleString("en-IN") : "-"),
          h("td", { className: "p-2 text-right text-green-600" }, entry.amount > 0 ? "₹" + entry.amount.toLocaleString("en-IN") : "-"),
          h("td", { className: "p-2 text-right font-bold " + (bal < 0 ? "text-red-600" : "text-green-600") }, "₹" + bal.toLocaleString("en-IN")),
          h("td", { className: "p-2" },
            h("button", { onClick: function() { deleteEntry(entry); }, className: "text-[10px] px-2 py-0.5 bg-red-50 text-red-600 border rounded" }, "Del")
          )
        )
      );
    })(partyRows[r]);
  }

  var partyOpts = [];
  for (var p1 = 0; p1 < parties.length; p1++) {
    partyOpts.push(h("option", { key: parties[p1].id, value: parties[p1].id }, parties[p1].id));
  }

  var counterOpts = [];
  for (var p2 = 0; p2 < parties.length; p2++) {
    if (parties[p2].id !== selectedParty) {
      counterOpts.push(h("option", { key: parties[p2].id, value: parties[p2].id }, parties[p2].id));
    }
  }

  var statusText = status === "saving" ? "Saving..." : status === "saved" ? "Saved" : status === "error" ? "Failed" : "Cloud";

  var tableBody = rows.length > 0 ? rows : [h("tr", { key: "empty" }, h("td", { colSpan: 7, className: "p-6 text-center text-slate-400" }, "No entries"))];

  return h("div", { className: "min-h-screen bg-slate-100" },
    h("header", { className: "bg-white border-b p-3 flex justify-between items-center" },
      h("div", { className: "font-black text-[15px]" }, companyName || "ULTRA LEDGER"),
      h("div", { className: "flex gap-2 items-center" },
        h("span", { className: "text-[11px] px-2 py-1 bg-slate-100 rounded" }, statusText),
        h("button", { onClick: doLogout, className: "px-3 py-1 border rounded font-bold text-[12px]" }, "Logout")
      )
    ),
    h("div", { className: "p-4" },
      h("div", { className: "bg-white p-3 rounded-xl border mb-4 flex gap-3 items-center" },
        h("label", { className: "font-bold text-[13px]" }, "Party:"),
        h("select", { value: selectedParty, onChange: function(e) { setSelectedParty(e.target.value); }, className: "border rounded px-3 py-2" }, partyOpts),
        h("div", { className: "text-[18px] font-black " + (totalBalance >= 0 ? "text-green-600" : "text-red-600") }, "₹" + totalBalance.toLocaleString("en-IN"))
      ),
      h("div", { className: "bg-white rounded-xl border mb-4 overflow-hidden" },
        h("table", { className: "w-full text-[13px]" },
          h("thead", { className: "bg-slate-100" },
            h("tr", null,
              h("th", { className: "p-2 text-left text-[11px] uppercase" }, "Date"),
              h("th", { className: "p-2 text-left text-[11px] uppercase" }, "Counter"),
              h("th", { className: "p-2 text-left text-[11px] uppercase" }, "Remark"),
              h("th", { className: "p-2 text-right text-[11px] uppercase" }, "Debit"),
              h("th", { className: "p-2 text-right text-[11px] uppercase" }, "Credit"),
              h("th", { className: "p-2 text-right text-[11px] uppercase" }, "Balance"),
              h("th", { className: "p-2 text-left text-[11px] uppercase" }, "Act")
            )
          ),
          h("tbody", null, tableBody)
        )
      ),
      h("div", { className: "bg-white p-3 rounded-xl border flex gap-2" },
        h("div", { style: { flex: "0 0 20%" } },
          h("select", { value: counter, onChange: function(e) { setCounter(e.target.value); }, className: "w-full border rounded p-2" }, counterOpts)
        ),
        h("input", { value: amount, onChange: function(e) { setAmount(e.target.value); }, placeholder: "Amount", className: "border rounded p-2", style: { flex: "0 0 20%" } }),
        h("input", { value: remark, onChange: function(e) { setRemark(e.target.value); }, placeholder: "Remark", className: "border rounded p-2", style: { flex: "1" }, onKeyDown: function(e) { if (e.key === "Enter") addEntry(); } }),
        h("button", { onClick: addEntry, className: "bg-cyan-600 text-white px-5 rounded font-bold" }, "ADD")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
