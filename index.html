const STORE_NAME = "app_state";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSave(key, value) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({ key, value });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

async function idbLoad(key) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}

function SearchableSelect({ value, options, onChange, T, style, className, dropUp, placeholder, onSelectComplete, triggerRef, onTriggerKeyDown, triggerTabIndex }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [highlightIdx, setHighlightIdx] = useState(0);
  const ref = useRef(null);
  const inputRef = useRef(null);

  const filtered = useMemo(() => {
    if (!query.trim()) return options;
    const q = query.toLowerCase();
    return options.filter(o => (o.id || o.name || String(o)).toLowerCase().includes(q));
  }, [options, query]);

  useEffect(() => {
    function handleClick(e) {
      if (ref.current && !ref.current.contains(e.target)) {
        setOpen(false); setQuery(""); setHighlightIdx(0);
      }
    }
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, []);

  useEffect(() => {
    if (open && inputRef.current) setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 30);
    if (open) setHighlightIdx(0);
  }, [open]);

  const select = (val) => {
    onChange(val);
    setOpen(false);
    setQuery("");
    setHighlightIdx(0);
    if (onSelectComplete) setTimeout(onSelectComplete, 80);
  };

  const handleInputKeyDown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setHighlightIdx(i => Math.min(i+1, filtered.length-1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setHighlightIdx(i => Math.max(i-1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); const item = filtered[highlightIdx]; if (item) select(item.id || item.name || String(item)); }
    else if (e.key === "Escape") { setOpen(false); setQuery(""); }
    else if (e.key === "Tab") { e.preventDefault(); setOpen(false); setQuery(""); if (onTriggerKeyDown) onTriggerKeyDown(e); }
  };

  const handleTriggerKeyDown = (e) => {
    if (e.key === "Tab") { e.preventDefault(); setOpen(false); setQuery(""); if (onTriggerKeyDown) onTriggerKeyDown(e); }
    else if (e.key === "Enter") { e.preventDefault(); setOpen(true); }
  };

  const getLabel = (o) => o.name || o.id || String(o);
  const getId = (o) => o.id || o.name || String(o);
  const popupPosition = dropUp ? { bottom: "100%", marginBottom: "4px" } : { top: "100%", marginTop: "4px" };
  const displayValue = value || placeholder || "Select";
  const tabIdx = triggerTabIndex !== undefined ? triggerTabIndex : 0;

  return h("div", { ref, className:"relative", style: style || {} },
    h("button", {
      type:"button",
      ref: triggerRef,
      tabIndex: tabIdx,
      onClick: () => setOpen(v => !v),
      onKeyDown: handleTriggerKeyDown,
      className: "w-full h-10 rounded-lg border px-3 text-left flex items-center justify-between " + (className || "") + " " + T.input
    },
      h("span", { className:"truncate " + (value ? "" : "opacity-50") }, displayValue),
      h("span", { className:"text-[11px] opacity-60 shrink-0 ml-1" }, dropUp ? "▲" : "▼")
    ),
    open && h("div", {
      className:"absolute left-0 right-0 rounded-lg border shadow-2xl z-50 overflow-hidden " + T.card,
      style: Object.assign({ maxHeight:"260px", display:"flex", flexDirection:"column" }, popupPosition)
    },
      h("div", { className:"p-1.5 border-b shrink-0" },
        h("input", {
          ref: inputRef, value: query,
          onChange: e => { setQuery(e.target.value); setHighlightIdx(0); },
          onKeyDown: handleInputKeyDown,
          placeholder: "Type to search...",
          className: "w-full h-8 rounded border px-2 text-[13px] font-bold " + T.input
        })
      ),
      h("div", { className:"overflow-auto flex-1" },
        filtered.length === 0 ? h("div", { className:"p-3 text-[12px] text-center opacity-60 font-bold" }, "No match") :
        filtered.map((o, i) => {
          const id = getId(o);
          const isHL = i === highlightIdx;
          const isSel = id === value;
          return h("button", {
            key: id, type:"button",
            tabIndex: -1,
            onClick: () => select(id),
            onMouseEnter: () => setHighlightIdx(i),
            className: "w-full text-left px-3 py-2 text-[13px] flex items-center justify-between " + (isHL ? "bg-cyan-50 text-cyan-900 font-bold" : "hover:bg-gray-50") + (isSel ? " bg-cyan-100" : "")
          },
            h("span", null, getLabel(o)),
            isSel && h("span", { className:"text-[10px] text-cyan-600 font-black" }, "✓")
          );
        })
      )
    )
  );
}

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function doLogin(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const uname = username.trim().toLowerCase();
      if (!uname) throw new Error("Username required");
      const { data: prof } = await sb.from("profiles").select("username, company_id").eq("username", uname).maybeSingle();
      if (!prof || !prof.company_id) throw new Error("Username not found");
      const { data: comp } = await sb.from("companies").select("code").eq("id", prof.company_id).single();
      if (!comp) throw new Error("Company not found");
      const email = uname + "." + comp.code.toLowerCase() + EMAIL_DOMAIN;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Wrong username or password");
      if (onLogin) await onLogin(data.session);
    } catch (e) { setErr(e.message || "Login failed"); } finally { setBusy(false); }
  }

  return h("div", { className:"min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-cyan-50 p-4" },
    h("div", { className:"w-full max-w-md" },

        h("div", { className:"space-y-4" },

          h("div", null,
            h("label", { className:"text-[11px] font-black uppercase tracking-widest text-slate-500 block mb-1.5" }, "Password"),
            h("input", { type:"password", value: password, onChange: e => setPassword(e.target.value), placeholder:"••••••••", className:"w-full h-12 rounded-xl border border-slate-300 px-4 text-[14px] font-bold outline-none focus:border-cyan-500" }))),

        h("button", { type:"submit", disabled: busy, className:"mt-5 w-full h-12 rounded-xl bg-cyan-600 hover:bg-cyan-700 disabled:opacity-50 text-white font-black text-[14px]" }, busy ? "..." : "LOGIN"))));
}

function ChangePasswordCard({ T }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showCurrent, setShowCurrent] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  async function changePassword() {
    setMsg(null);
    if (!currentPassword) return setMsg({ type:"err", text:"Current password required" });
    if (!newPassword || newPassword.length < 6) return setMsg({ type:"err", text:"New password min 6 characters" });
    if (newPassword !== confirmPassword) return setMsg({ type:"err", text:"Passwords do not match" });
    if (currentPassword === newPassword) return setMsg({ type:"err", text:"New password must be different" });

    setBusy(true);
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user || !user.email) throw new Error("Session expired. Please logout and login again.");

      const { error: verifyErr } = await sb.auth.signInWithPassword({
        email: user.email,
        password: currentPassword
      });
      if (verifyErr) throw new Error("Current password is wrong");

      const { error: updateErr } = await sb.auth.updateUser({ password: newPassword });
      if (updateErr) throw new Error(updateErr.message || "Failed to update password");

      setMsg({ type:"ok", text:"✅ Password changed successfully!" });
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
      setTimeout(() => setMsg(null), 4000);
    } catch (e) {
      setMsg({ type:"err", text: e.message || "Failed to change password" });
    } finally {
      setBusy(false);
    }
  }

  function suggestPassword() {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    let r = "";
    for (let i = 0; i < 8; i++) r += chars[Math.floor(Math.random() * chars.length)];
    const pwd = "pass@" + r;
    setNewPassword(pwd);
    setConfirmPassword(pwd);
    setShowNew(true);
  }

  return h("div", { className:"rounded-xl border p-6 "+T.card },
    h("div", { className:"font-black text-[15px] mb-1 uppercase tracking-wide flex items-center gap-2" }, "🔑 CHANGE PASSWORD"),
    h("div", { className:"text-[12px] font-semibold opacity-70 mb-4" }, "Apna login password change karne ke liye current password daalein."),
    h("div", { className:"space-y-3" },
      h("div", null,
        h("label", { className:"text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "Current Password"),
        h("div", { className:"relative" },
          h("input", {
            type: showCurrent ? "text" : "password",
            tabIndex: -1,
            value: currentPassword,
            onChange: e => { setCurrentPassword(e.target.value); setMsg(null); },
            placeholder: "Enter current password",
            className: "w-full h-12 rounded-lg border px-4 pr-12 text-[14px] font-bold "+T.input
          }),
          h("button", { tabIndex: -1, type:"button", onClick: () => setShowCurrent(!showCurrent),
            className:"absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded flex items-center justify-center text-[16px] hover:bg-slate-100" },
            showCurrent ? "🙈" : "👁️")
        )
      ),
      h("div", null,
        h("label", { className:"text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "New Password (min 6 chars)"),
        h("div", { className:"relative" },
          h("input", {
            type: showNew ? "text" : "password",
            tabIndex: -1,
            value: newPassword,
            onChange: e => { setNewPassword(e.target.value); setMsg(null); },
            placeholder: "Enter new password",
            className: "w-full h-12 rounded-lg border px-4 pr-24 text-[14px] font-bold "+T.input
          }),
          h("button", { tabIndex: -1, type:"button", onClick: () => setShowNew(!showNew),
            className:"absolute right-10 top-1/2 -translate-y-1/2 w-8 h-8 rounded flex items-center justify-center text-[16px] hover:bg-slate-100" },
            showNew ? "🙈" : "👁️"),
          h("button", { tabIndex: -1, type:"button", onClick: suggestPassword,
            className:"absolute right-1 top-1/2 -translate-y-1/2 h-8 px-2 rounded bg-cyan-100 text-cyan-700 text-[10px] font-black hover:bg-cyan-200" },
            "🎲")
        )
      ),
      h("div", null,
        h("label", { className:"text-[11px] font-black uppercase tracking-wide opacity-70 block mb-1.5" }, "Confirm New Password"),
        h("input", {
          type: showNew ? "text" : "password",
          tabIndex: -1,
          value: confirmPassword,
          onChange: e => { setConfirmPassword(e.target.value); setMsg(null); },
          placeholder: "Re-enter new password",
          className: "w-full h-12 rounded-lg border px-4 text-[14px] font-bold "+T.input
        })
      ),
      msg && h("div", { className:"p-3 rounded-lg text-[12px] font-bold " +
        (msg.type === "ok" ? "bg-green-50 border border-green-200 text-green-700" : "bg-red-50 border border-red-200 text-red-700") },
        msg.text),
      h("button", { tabIndex: -1, onClick: changePassword, disabled: busy,
        className:"w-full h-12 rounded-lg font-black text-[14px] "+(busy ? "opacity-50 cursor-not-allowed " : "")+T.addBtn },
        busy ? "Changing..." : "🔒 Change Password")
    )
  );
}

    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [parties, ledgers, finals, pin, theme, sidebarOpen, companyName, history, lastBackupTime, selectedParty, counter]);

  useEffect(() => {

      try { idbSave("state", snap); } catch(e) {}

  }, [companyId]);

  useEffect(() => { const iv = setInterval(() => setBackupCheckTick(t => t + 1), 60000); return () => clearInterval(iv); }, []);
  const hoursSinceBackup = lastBackupTime ? (Date.now() - lastBackupTime) / (1000 * 60 * 60) : 9999;
  const backupDue = hoursSinceBackup >= 24;

  useEffect(() => { if(toast){ const t=setTimeout(()=>setToast(null),2500); return ()=>clearTimeout(t); } }, [toast]);
  useEffect(() => { if (tableEndRef.current) tableEndRef.current.scrollIntoView({ behavior:"smooth", block:"end" }); }, [ledgers.length, selectedParty, tab]);
  useEffect(() => { if (tab !== "ledger") return; const t = setTimeout(() => { if (counterRef.current) counterRef.current.focus(); }, 350); return () => clearTimeout(t); }, [tab, selectedParty]);

  const T = THEMES[theme] || THEMES.ocean;
  const selectedPartyObj = parties.find(p => p.id === selectedParty);
  const isSelectedPartyDeactive = selectedPartyObj && selectedPartyObj.status !== "Active";

  const partyEntries = useMemo(() => ledgers.filter(l => l.partyId === selectedParty).sort((a,b)=>a.createdAt-b.createdAt), [ledgers, selectedParty]);
  const balMap = useMemo(() => { const m = new Map(); let run = 0; partyEntries.forEach(e => { run += e.amount; m.set(e.id, run); }); return { map:m, total:run }; }, [partyEntries]);
  const filteredEntries = useMemo(() => { if(!search.trim()) return partyEntries; const s = search.toLowerCase(); return partyEntries.filter(e => (dmy(e.date)+" "+(e.time||"")+" "+(e.counterPartyId||"")+" "+(e.remark||"")+" "+e.amount).toLowerCase().includes(s)); }, [partyEntries, search]);

  const isLocked = (e) => {
    if (e.openingLocked === true) return true;
    if ((e.remark||"").toLowerCase()==="opening") return true;

    if (e.pairId && finals.some(g => (g.counterEntries||[]).some(fe => fe.pairId === e.pairId))) return true;
    return false;
  };

  const getLockReason = (e) => {
    if (e.openingLocked || (e.remark||"").toLowerCase()==="opening") return "Opening Balance – Locked";
    if (e.finalLocked) return "FINAL Closing ke baad counter entry locked";
    if (e.pairId && finals.some(g => (g.counterEntries||[]).some(fe => fe.pairId === e.pairId))) return "This entry is part of a finalized group – Locked";

  };

  const allPartyBalances = useMemo(() => { const m = {}; parties.forEach(p => { m[p.id] = ledgers.filter(l=>l.partyId===p.id).reduce((a,e)=>a+e.amount,0); }); return m; }, [parties, ledgers]);

  const trial = useMemo(() => {
    let src = ledgers;
    if(filterFrom) src = src.filter(e => e.date >= filterFrom);
    if(filterTo) src = src.filter(e => e.date <= filterTo);
    const debitParties = [], creditParties = [];
    parties.filter(p=>p.status==="Active").forEach(p => {
      const bal = src.filter(l=>l.partyId===p.id).reduce((a,e)=>a+e.amount,0);
      if(bal<0) debitParties.push({ party:p, bal:bal });
      else if(bal>0) creditParties.push({ party:p, bal:bal });
    });
    const debit = debitParties.reduce((a,x)=>a+Math.abs(x.bal),0);
    const credit = creditParties.reduce((a,x)=>a+x.bal,0);
    const diff = credit - debit;
    const status = diff===0 ? "BALANCED" : diff>0 ? "CREDIT EXCESS "+Math.abs(diff).toLocaleString("en-IN") : "DEBIT EXCESS "+Math.abs(diff).toLocaleString("en-IN");
    return { debitParties, creditParties, debit, credit, diff, status };
  }, [ledgers, parties, filterFrom, filterTo]);

  const finalRows = useMemo(() => {
    if(!finals.length) return [];
    if(!finalFilterParty) return [];
    const filteredFinals = finals.filter(g => g.partyId === finalFilterParty);
    const sorted = filteredFinals.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    let run = 0; const out = [];
    sorted.forEach(g => {
      g.entries.forEach(e => {
        const isCF = e.carryForward === true;

      });
      out.push({ id:"closing_"+g.id, partyId:g.partyId, date:g.closedAt, time:"", counterPartyId:"-", remark:"FINAL CLOSING BALANCE • "+g.partyId, amount:0, _debit:"-", _credit:"-", _bal:run, isClosing:true });
    });
    if (finalSearch.trim()) { const s = finalSearch.toLowerCase(); return out.filter(r => (dmy(r.date)+" "+(r.partyId||"")+" "+(r.counterPartyId||"")+" "+(r.remark||"")+" "+r._bal).toLowerCase().includes(s)); }

  const frRows = useMemo(() => {

    let run = 0; const out = [];
    sorted.forEach(g => {
      g.entries.forEach(e => {
        const isCF = e.carryForward === true;

        out.push({ id:e.id, partyId:g.partyId, date:e.date, time:e.time, counterPartyId: isCF ? "B/F" : e.counterPartyId, remark: isCF ? "Opening" : e.remark, amount: isCF ? 0 : e.amount, _debit: (!isCF && e.amount<0) ? Math.abs(e.amount).toString() : "-", _credit: (!isCF && e.amount>0) ? e.amount.toString() : "-", _bal:run, isClosing:false, isOpeningEntry:isCF });
      });
      out.push({ id:"closing_"+g.id, partyId:g.partyId, date:g.closedAt, time:"", counterPartyId:"-", remark:"FINAL CLOSING BALANCE • "+g.partyId, amount:0, _debit:"-", _credit:"-", _bal:run, isClosing:true });
    });

    }, "Backup JSON");

  const triggerRestore = () => { if (fileInputRef.current) fileInputRef.current.click(); };

    if(!f) return;
    e.target.value = "";
    requirePin(() => {

  const handleRemovePin = () => { requirePin(() => { if (confirm("Remove PIN?")) { setPin(""); setPinProfileMsg(""); showToast("PIN Removed"); } }, "Remove PIN"); };

    const { data: sub } = sb.auth.onAuthStateChange(async (event, sess) => {
      if (event === "SIGNED_OUT") {
        setSession(null); setCloudState(null); setCompanyId(null); setProfile(null); setReady(true);
      }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  async function loadAll(sess) {
    try {
      setBootMsg("Loading profile...");
      const { data: prof } = await sb.from("profiles").select("*").eq("id", sess.user.id).single();
      if (!prof || !prof.company_id) { await sb.auth.signOut(); setReady(true); return; }
      setCompanyId(prof.company_id);
      setProfile(prof);
      setSession(sess);
      setBootMsg("Loading ledger...");

      // Try cloud first
      const { data: st } = await sb.from("company_state").select("state").eq("company_id", prof.company_id).single();
      if (st && st.state) {
        setCloudState(st.state);
      } else {
        // Try localStorage backup
        let cached = null;
        try {
          const raw = localStorage.getItem("ul_state_" + prof.company_id);
          if (raw) cached = JSON.parse(raw);
        } catch(e) {}
        if (!cached) {
          cached = await idbLoad("cache_" + prof.company_id);
        }
        setCloudState(cached || { parties: SEED_PARTIES, ledgers: SEED_OPEN, finals: [], history: [], companyName: "", theme: "ocean", pin: "", lastBackupTime: 0 });
      }
      setReady(true);
    } catch (e) {
      console.error("Load error:", e);
      setReady(true);
    }
  }

  async function saveCloud(newState) {
    if (!companyId || !session) return;
    setSaveStatus("saving");
    try {
      await sb.from("company_state").upsert({
        company_id: companyId,
        state: newState,
        updated_at: new Date().toISOString(),
        updated_by: session.user.id
      }, { onConflict: "company_id" });
      setSaveStatus("saved");
      try { await idbSave("cache_" + companyId, newState); } catch(e) {}
      setTimeout(() => setSaveStatus("idle"), 1500);
    } catch (e) { console.error("Save err:", e); setSaveStatus("idle"); }
  }

  if (!ready) return h("div", { className:"min-h-screen flex items-center justify-center bg-slate-50" },
    h("div", { className:"text-center" },
      h("div", { className:"text-[40px] mb-3" }, "📒"),
      h("div", { className:"text-[15px] font-black text-slate-700" }, bootMsg)));

  if (!session) return h(LoginScreen, { onLogin: loadAll });
  return h(OriginalApp, {
    onLogout: () => sb.auth.signOut(),
    cloudState,
    saveCloud,
    cloudSaveStatus: saveStatus,
    profile: profile,
    companyId: companyId
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
</script>
</body>
</html>
