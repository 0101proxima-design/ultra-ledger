          h("table", { className: "w-full", style: { fontSize: "13px" } },
            h("thead", { className: "sticky top-0 z-[5] " + C.tableHeader },
              h("tr", null, ["Date", "Counter", "Remark", "Debit", "Credit", "Balance"].map(function(hd) { return h("th", { key: hd, className: "py-1.5 px-2.5 text-left font-black text-[11px] uppercase" }, hd); }))),

    historyOpen ? h("div", { className: "fixed inset-0 z-[80] bg-black/60 flex items-center justify-center p-4", onClick: function() { setHistoryOpen(false); } },
      h("div", { className: "w-full max-w-5xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] " + C.card, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "bg-gray-900 text-white px-4 py-3 flex justify-between" },

          h("select", { value: historyFilter, onChange: function(e) { setHistoryFilter(e.target.value); }, className: "h-8 rounded border px-2 text-[12px] font-bold " + C.input },
            h("option", null, "All"),
            parties.map(function(p) { return h("option", { key: p.id }, p.id); })),
          h("button", { onClick: exportHistory, className: "h-8 px-3 rounded text-[12px] font-black bg-slate-900 text-white" }, "Export")),
        h("div", { className: "overflow-auto flex-1" },
          h("table", { className: "w-full", style: { fontSize: "13px" } },
            h("thead", { className: C.tableHeader },

                h("td", { className: "py-1.5 px-2.5 font-bold" }, x.timeDisplay),
                h("td", { className: "py-1.5 px-2.5" }, h("span", { className: "px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-[11px] font-black" }, x.action)),
                h("td", { className: "py-1.5 px-2.5 font-black text-[13px]" }, x.partyId),
                h("td", { className: "py-1.5 px-2.5 font-mono font-bold text-[12px]" }, x.oldVal),
                h("td", { className: "py-1.5 px-2.5 font-mono font-bold text-[12px]" }, x.newVal),
                h("td", { className: "py-1.5 px-2.5 font-semibold truncate max-w-[200px]" }, x.remark));
            }))))))

    editEntry ? h("div", { className: modalStyle, onClick: function() { setEditEntry(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px] mb-3" }, "Modify Entry"),
        h("div", { className: "space-y-3" },
          h("input", { type: "date", value: editForm.date, onChange: function(e) { var nf = {}; for (var k in editForm) nf[k] = editForm[k]; nf.date = e.target.value; setEditForm(nf); }, className: "w-full h-10 rounded-lg border px-3 text-[13px] font-bold" }),
          h("input", { value: editForm.counter, onChange: function(e) { var nf = {}; for (var k in editForm) nf[k] = editForm[k]; nf.counter = e.target.value.toUpperCase(); setEditForm(nf); }, className: "w-full h-10 rounded-lg border px-3 text-[13px] font-bold" }),
          h("input", { value: editForm.amount, onChange: function(e) { var nf = {}; for (var k in editForm) nf[k] = editForm[k]; nf.amount = e.target.value; setEditForm(nf); }, className: "w-full h-10 rounded-lg border px-3 text-[15px] font-black" }),
          h("input", { value: editForm.remark, onChange: function(e) { var nf = {}; for (var k in editForm) nf[k] = editForm[k]; nf.remark = e.target.value; setEditForm(nf); }, className: "w-full h-10 rounded-lg border px-3 text-[13px]" }),
          h("div", { className: "flex gap-2 pt-2" },
            h("button", { onClick: function() { setEditEntry(null); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "Cancel"),
            h("button", { onClick: saveEdit, className: "flex-1 h-11 rounded-lg font-black bg-cyan-600 text-white" }, "Save"))))

    // DELETE MODAL
    deleteEntry ? h("div", { className: modalStyle, onClick: function() { setDeleteEntry(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },

        h("div", { className: "flex gap-2" },
          h("button", { onClick: function() { setDeleteEntry(null); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "Cancel"),
          h("button", { onClick: doDelete, className: "flex-1 h-11 rounded-lg bg-red-600 text-white font-black" }, "Delete Both")))
    ) : null,

    // FINAL MODAL
    confirmFinal ? h("div", { className: modalStyle, onClick: function() { setConfirmFinal(false); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px] mb-3" }, "FINAL Closing – " + selectedParty + "?"),
        h("p", { className: "text-[13px] mb-4" }, "Move entries (Balance " + fmtINR(balMap.total) + ") to Final Report."),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: function() { setConfirmFinal(false); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "Cancel"),
          h("button", { onClick: doFinal, className: "flex-1 h-11 rounded-lg font-black " + C.closingBtn }, "Confirm FINAL")))
    ) : null,

    // LOCKED MODAL
    lockedInfo ? h("div", { className: modalStyle, onClick: function() { setLockedInfo(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px] mb-3" }, "🔒 Entry Locked"),
        h("p", { className: "text-[13px] mb-4" }, lockedInfo.reason),
        h("button", { onClick: function() { setLockedInfo(null); }, className: "w-full h-11 rounded-lg bg-black text-white font-black" }, "OK"))

    // PARTY CONFIRM
    partyConfirm ? h("div", { className: modalStyle, onClick: function() { setPartyConfirm(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px] mb-3" }, 'Create Party "' + partyConfirm.name + '" ?'),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: function() { setPartyConfirm(null); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "Cancel"),
          h("button", { onClick: confirmAddParty, className: "flex-1 h-11 rounded-lg font-black " + C.addBtn }, "Yes, Create")))

    // TOGGLE CONFIRM
    toggleConfirm ? h("div", { className: modalStyle, onClick: function() { setToggleConfirm(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px] mb-3" }, toggleConfirm.next + " " + toggleConfirm.party.id + " ?"),
        h("p", { className: "text-[13px] mb-4" }, "Balance " + fmtINR(allPartyBalances[toggleConfirm.party.id] || 0)),
        h("div", { className: "flex gap-2" },
          h("button", { onClick: function() { setToggleConfirm(null); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "No"),

    ) : null,

    // EDIT PARTY
    editParty ? h("div", { className: modalStyle, onClick: function() { setEditParty(null); } },
      h("div", { className: modalBox, onClick: function(e) { e.stopPropagation(); } },

        h("div", { className: "flex gap-2 mt-3" },
          h("button", { onClick: function() { setEditParty(null); }, className: "flex-1 h-11 rounded-lg border font-bold bg-white" }, "Cancel"),
          h("button", { onClick: saveEditParty, className: "flex-1 h-11 rounded-lg font-black " + C.addBtn }, "Save")))
    ) : null,

    // PIN PROMPT
    pinPrompt ? h("div", { className: "fixed inset-0 z-[95] bg-black/70 flex items-center justify-center p-4", onClick: function() { setPinPrompt(null); } },
      h("div", { className: "w-full max-w-[400px] rounded-xl bg-white shadow-2xl p-5 flex flex-col gap-3", onClick: function(e) { e.stopPropagation(); } },
        h("div", { className: "font-black text-[15px]" }, "🔐 PIN Required"),

        pinPromptErr ? h("div", { className: "text-[12px] text-red-600 text-center font-bold" }, pinPromptErr) : null,

          h("button", { onClick: function() { setPinPrompt(null); }, className: "flex-1 h-11 rounded-lg border font-black" }, "Cancel"),
          h("button", { onClick: confirmPin, className: "flex-1 h-11 rounded-lg bg-black text-white font-black" }, "Confirm")))
    ) : null,

    toast ? h("div", { className: "fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-full bg-black text-white text-[14px] font-black shadow-2xl" }, "✓ " + toast) : null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
