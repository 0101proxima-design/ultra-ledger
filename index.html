<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ULTRA LEDGER</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { useState, useEffect, useRef } = React;
const sb = supabase.createClient("https://kzgqsjbayluqyhjhytkt.supabase.co", "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ");
const DOMAIN = "@ultraledger.local";

function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [ready, setReady] = useState(false);
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(true);
  const [parties, setParties] = useState([{id:"AA"},{id:"BB"}]);
  const [ledgers, setLedgers] = useState([]);
  const [selParty, setSelParty] = useState("AA");
  const [counter, setCounter] = useState("BB");
  const [amount, setAmount] = useState("");
  const [remark, setRemark] = useState("");
  const [status, setStatus] = useState("");
  const [companyId, setCompanyId] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(r => {
      if (r.data.session) {
        setSession(r.data.session);
        sb.from("profiles").select("*").eq("id", r.data.session.user.id).single().then(pr => {
          setProfile(pr.data);
          setReady(true);
        });
      } else setReady(true);
    });
    const sub = sb.auth.onAuthStateChange((e, s) => {
      if (e === "SIGNED_OUT") { setSession(null); setProfile(null); }
    });
    return () => sub.data.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session || !profile || !profile.company_id) return;
    const cid = profile.company_id;
    setCompanyId(cid);
    sb.from("company_state").select("state").eq("company_id", cid).maybeSingle().then(st => {
      let cloud = st.data && st.data.state;
      let local = null;
      try { local = JSON.parse(localStorage.getItem("ul_state_" + cid)); } catch(e) {}
      let final = cloud && cloud.ledgers ? cloud : (local && local.ledgers ? local : { parties: [{id:"AA"},{id:"BB"}], ledgers: [] });
      if (cloud && local) {
        final = cloud.ledgers.length >= local.ledgers.length ? cloud : local;
      }
      setParties(final.parties || [{id:"AA"},{id:"BB"}]);
      setLedgers(final.ledgers || []);
      setLoading(false);
    });
  }, [session, profile]);

  async function doLogin(e) {
    e.preventDefault();
    setErr("");
    const uname = username.trim().toLowerCase();
    const pr = await sb.from("profiles").select("company_id").eq("username", uname).maybeSingle();
    if (!pr.data) return setErr("User not found");
    const co = await sb.from("companies").select("code").eq("id", pr.data.company_id).single();
    if (!co.data) return setErr("Company not found");
    const email = uname + "." + co.data.code.toLowerCase() + DOMAIN;
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) return setErr("Wrong password");
    setSession(r.data.session);
    const pr2 = await sb.from("profiles").select("*").eq("id", r.data.session.user.id).single();
    setProfile(pr2.data);
  }

  async function saveCloud() {
    if (!companyId) return;
    setStatus("saving");
    const st = { parties, ledgers, savedAt: Date.now() };
    try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(st)); } catch(e) {}
    const r = await sb.from("company_state").upsert({
      company_id: companyId,
      state: st,
      updated_at: new Date().toISOString(),
      updated_by: session.user.id
    }, { onConflict: "company_id" });
    if (r.error) { setStatus("error"); return; }
    setStatus("saved");
    setTimeout(() => setStatus(""), 1500);
  }

  async function addEntry() {
    if (!amount) return;
    const nums = amount.split("/").map(x => parseFloat(x.trim())).filter(n => !isNaN(n) && n !== 0);
    if (!nums.length) return;
    if (selParty === counter) return alert("Same party");
    const now = Date.now();
    const date = new Date().toISOString().slice(0, 10);
    const time = String(new Date().getHours()).padStart(2, "0") + ":" + String(new Date().getMinutes()).padStart(2, "0");
    const newEntries = [];
    nums.forEach((n, i) => {
      const pid = "pair_" + now + "_" + i;
      newEntries.push({ id: "e_" + now + "_" + i + "_1", pairId: pid, date, time, partyId: selParty, counterPartyId: counter, amount: n, remark: remark.trim(), createdAt: now + i * 2 });
      newEntries.push({ id: "e_" + now + "_" + i + "_2", pairId: pid, date, time, partyId: counter, counterPartyId: selParty, amount: -n, remark: remark.trim(), createdAt: now + i * 2 + 1 });
    });
    const newLedgers = ledgers.concat(newEntries);
    setLedgers(newLedgers);
    setAmount("");
    setRemark("");
    await saveCloudWith(newLedgers);
  }

  async function saveCloudWith(newLedgers) {
    if (!companyId) return;
    setStatus("saving");
    const st = { parties, ledgers: newLedgers, savedAt: Date.now() };
    try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(st)); } catch(e) {}
    const r = await sb.from("company_state").upsert({
      company_id: companyId, state: st,
      updated_at: new Date().toISOString(),
      updated_by: session.user.id
    }, { onConflict: "company_id" });
    if (r.error) { setStatus("error"); console.error(r.error); return; }
    setStatus("saved");
    setTimeout(() => setStatus(""), 1500);
  }

  async function doLogout() {
    if (companyId) {
      const st = { parties, ledgers, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(st)); } catch(e) {}
      await sb.from("company_state").upsert({
        company_id: companyId, state: st,
        updated_at: new Date().toISOString(),
        updated_by: session.user.id
      }, { onConflict: "company_id" });
    }
    await sb.auth.signOut();
  }

  if (!ready) return h("div", null, "Loading...");

  if (!session) {
    return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100" },
      h("form", { onSubmit: doLogin, className: "bg-white p-8 rounded-xl shadow-xl w-96" },
        h("div", { className: "text-center text-2xl font-black mb-4" }, "📒 ULTRA LEDGER"),
        h("input", { value: username, onChange: e => setUsername(e.target.value.toLowerCase()), placeholder: "Username", className: "w-full h-12 border rounded px-4 mb-2" }),
        h("input", { type: "password", value: password, onChange: e => setPassword(e.target.value), placeholder: "Password", className: "w-full h-12 border rounded px-4 mb-2" }),
        err ? h("div", { className: "text-red-600 text-sm mb-2" }, err) : null,
        h("button", { className: "w-full h-12 bg-cyan-600 text-white rounded font-bold" }, "LOGIN")
      )
    );
  }

  if (loading) return h("div", null, "Loading...");

  const partyRows = ledgers.filter(l => l.partyId === selParty).sort((a, b) => a.createdAt - b.createdAt);
  let bal = 0;
  const rows = partyRows.map(e => {
    bal += e.amount;
    return h("tr", { key: e.id, className: "border-t" },
      h("td", { className: "p-2 text-xs" }, e.date + " " + e.time),
      h("td", { className: "p-2 font-bold" }, e.counterPartyId || "-"),
      h("td", { className: "p-2" }, e.remark || "-"),
      h("td", { className: "p-2 text-right text-red-600" }, e.amount < 0 ? "₹" + Math.abs(e.amount) : "-"),
      h("td", { className: "p-2 text-right text-green-600" }, e.amount > 0 ? "₹" + e.amount : "-"),
      h("td", { className: "p-2 text-right font-bold" }, "₹" + bal)
    );
  });

  return h("div", { className: "min-h-screen bg-slate-100" },
    h("header", { className: "bg-white border-b p-3 flex justify-between" },
      h("div", { className: "font-black" }, "ULTRA LEDGER"),
      h("div", { className: "flex gap-2" },
        h("span", { className: "text-xs" }, status),
        h("button", { onClick: doLogout, className: "border px-3 py-1 rounded text-sm" }, "Logout")
      )
    ),
    h("div", { className: "p-4" },
      h("div", { className: "bg-white p-3 rounded-xl border mb-4" },
        h("select", { value: selParty, onChange: e => setSelParty(e.target.value), className: "border p-2 rounded" },
          parties.map(p => h("option", { key: p.id, value: p.id }, p.id))),
        h("span", { className: "ml-4 text-lg font-bold " + (bal >= 0 ? "text-green-600" : "text-red-600") }, "₹" + bal)
      ),
      h("div", { className: "bg-white rounded-xl border mb-4" },
        h("table", { className: "w-full text-sm" },
          h("thead", { className: "bg-slate-100" },
            h("tr", null,
              h("th", { className: "p-2 text-left" }, "Date"),
              h("th", { className: "p-2 text-left" }, "Counter"),
              h("th", { className: "p-2 text-left" }, "Remark"),
              h("th", { className: "p-2 text-right" }, "Debit"),
              h("th", { className: "p-2 text-right" }, "Credit"),
              h("th", { className: "p-2 text-right" }, "Balance")
            )
          ),
          h("tbody", null, rows.length > 0 ? rows : h("tr", null, h("td", { colSpan: 6, className: "p-4 text-center" }, "No entries")))
        )
      ),
      h("div", { className: "bg-white p-3 rounded-xl border flex gap-2" },
        h("select", { value: counter, onChange: e => setCounter(e.target.value), className: "border p-2 rounded" },
          parties.filter(p => p.id !== selParty).map(p => h("option", { key: p.id, value: p.id }, p.id))),
        h("input", { value: amount, onChange: e => setAmount(e.target.value), placeholder: "Amount", className: "border p-2 rounded" }),
        h("input", { value: remark, onChange: e => setRemark(e.target.value), placeholder: "Remark", className: "border p-2 rounded flex-1" }),
        h("button", { onClick: addEntry, className: "bg-cyan-600 text-white px-4 rounded font-bold" }, "ADD")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
