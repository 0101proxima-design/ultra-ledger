<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA LEDGER</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { margin: 0; padding: 0; font-family: Inter, Arial, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = "https://kzgqsjbayluqyhjhytkt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NllVu5uINdJpICN59kjKQA_ynf6GoUZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const EMAIL_DOMAIN = "@ultraledger.local";

function LoginScreen({ onLogin }) {
  const [u, setU] = useState("");
  const [p, setP] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  async function submit(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      const uname = u.trim().toLowerCase();
      const { data: prof } = await sb.from("profiles").select("username, company_id").eq("username", uname).maybeSingle();
      if (!prof || !prof.company_id) throw new Error("Username not found");
      const { data: comp } = await sb.from("companies").select("code").eq("id", prof.company_id).single();
      if (!comp) throw new Error("Company not found");
      const email = uname + "." + comp.code.toLowerCase() + EMAIL_DOMAIN;
      const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
      if (error) throw new Error("Wrong username or password");
      await onLogin(data.session);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }

  return h("div", { className: "min-h-screen flex items-center justify-center bg-slate-100 p-4" },
    h("form", { onSubmit: submit, className: "bg-white rounded-2xl shadow-xl p-8 w-full max-w-md" },
      h("div", { className: "text-center mb-6" },
        h("div", { className: "text-[52px]" }, "📒"),
        h("div", { className: "text-[24px] font-black text-slate-800" }, "ULTRA LEDGER")),
      h("input", { value: u, onChange: e => setU(e.target.value.toLowerCase()), placeholder: "Username", autoFocus: true,
        className: "w-full h-12 rounded-xl border px-4 mb-3 text-[14px] font-bold" }),
      h("input", { type: "password", value: p, onChange: e => setP(e.target.value), placeholder: "Password",
        className: "w-full h-12 rounded-xl border px-4 mb-4 text-[14px] font-bold" }),
      err && h("div", { className: "mb-3 p-3 rounded-lg bg-red-50 text-red-700 text-[12px] font-bold" }, err),
      h("button", { type: "submit", disabled: busy,
        className: "w-full h-12 rounded-xl bg-cyan-600 text-white font-black" },
        busy ? "..." : "LOGIN")));
}

function LedgerApp({ session, profile, onLogout }) {
  const [loading, setLoading] = useState(true);
  const [parties, setParties] = useState([]);
  const [ledgers, setLedgers] = useState([]);
  const [selectedParty, setSelectedParty] = useState("");
  const [counter, setCounter] = useState("");
  const [amount, setAmount] = useState("");
  const [remark, setRemark] = useState("");
  const [status, setStatus] = useState("");
  const [companyId, setCompanyId] = useState(null);
  const [companyName, setCompanyName] = useState("");
  const saveTimerRef = useRef(null);
  const skipRef = useRef(true);

  // Load on mount
  useEffect(() => {
    (async () => {
      try {
        // Get company_id
        const { data: prof } = await sb.from("profiles").select("company_id").eq("id", session.user.id).single();
        if (!prof || !prof.company_id) { onLogout(); return; }
        setCompanyId(prof.company_id);

        const { data: comp } = await sb.from("companies").select("name").eq("id", prof.company_id).single();
        setCompanyName(comp?.name || "");

        // Load cloud
        let cloudData = null;
        const { data: st } = await sb.from("company_state").select("state").eq("company_id", prof.company_id).maybeSingle();
        if (st && st.state) cloudData = st.state;

        // Load local
        let localData = null;
        try {
          const raw = localStorage.getItem("ul_state_" + prof.company_id);
          if (raw) localData = JSON.parse(raw);
        } catch(e) {}

        // Pick bigger
        let final = null;
        const c = [cloudData, localData].filter(d => d && Array.isArray(d.ledgers));
        if (c.length === 0) {
          final = { parties: [{id:"AA",name:"AA",status:"Active"},{id:"BB",name:"BB",status:"Active"}], ledgers: [], companyName: comp?.name || "" };
        } else {
          c.sort((a, b) => (b.ledgers.length) - (a.ledgers.length));
          final = c[0];
        }

        setParties(final.parties || []);
        setLedgers(final.ledgers || []);
        if (final.parties && final.parties.length > 0) {
          setSelectedParty(final.parties[0].id);
          if (final.parties.length > 1) setCounter(final.parties[1].id);
        }
        setLoading(false);
        setTimeout(() => { skipRef.current = false; }, 1000);
      } catch(e) { console.error(e); setLoading(false); }
    })();
  }, []);

  // Auto save to cloud (debounced)
  useEffect(() => {
    if (loading || skipRef.current || !companyId) return;
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const state = { parties, ledgers, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(state)); } catch(e) {}
      try {
        setStatus("saving");
        const { error } = await sb.from("company_state").upsert({
          company_id: companyId,
          state,
          updated_at: new Date().toISOString(),
          updated_by: session.user.id
        }, { onConflict: "company_id" });
        if (error) { console.error(error); setStatus("error"); }
        else { setStatus("saved"); setTimeout(() => setStatus(""), 1500); }
      } catch(e) { console.error(e); setStatus("error"); }
    }, 400);
    return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  }, [parties, ledgers, loading, companyId]);

  // Force save before logout
  async function doLogout() {
    if (companyId) {
      const state = { parties, ledgers, savedAt: Date.now() };
      try { localStorage.setItem("ul_state_" + companyId, JSON.stringify(state)); } catch(e) {}
      try {
        await sb.from("company_state").upsert({
          company_id: companyId, state,
          updated_at: new Date().toISOString(),
          updated_by: session.user.id
        }, { onConflict: "company_id" });
      } catch(e) {}
    }
    await onLogout();
  }

  function addEntry() {
    if (!amount || !counter || !selectedParty) return;
    if (selectedParty === counter) return alert("Same party");
    const nums = amount.split("/").map(s => parseFloat(s.trim())).filter(n => !isNaN(n) && n !== 0);
    if (!nums.length) return alert("Invalid amount");
    const now = Date.now();
    const date = new Date().toISOString().slice(0, 10);
    const time = String(new Date().getHours()).padStart(2, "0") + ":" + String(new Date().getMinutes()).padStart(2, "0");
    const newEntries = [];
    nums.forEach((n, i) => {
      const pairId = "pair_" + now + "_" + i;
      newEntries.push({ id: "e_" + now + "_" + i + "_1", pairId, date, time, partyId: selectedParty, counterPartyId: counter, amount: n, remark: remark.trim(), createdAt: now + i*2 });
      newEntries.push({ id: "e_" + now + "_" + i + "_2", pairId, date, time, partyId: counter, counterPartyId: selectedParty, amount: -n, remark: remark.trim(), createdAt: now + i*2 + 1 });
    });
    setLedgers(prev => prev.concat(newEntries));
    setAmount(""); setRemark("");
  }

  function deleteEntry(e) {
    if (e.openingLocked) return;
    if (!confirm("Delete from both sides?")) return;
    setLedgers(prev => prev.filter(x => x.pairId !== e.pairId));
  }

  const partyRows = useMemo(() => {
    return ledgers.filter(l => l.partyId === selectedParty).sort((a,b) => a.createdAt - b.createdAt);
  }, [ledgers, selectedParty]);

  const balance = useMemo(() => partyRows.reduce((a, e) => a + e.amount, 0), [partyRows]);

  const runningBalance = useMemo(() => {
    const m = new Map(); let run = 0;
    partyRows.forEach(e => { run += e.amount; m.set(e.id, run); });
    return m;
  }, [partyRows]);

  if (loading) return h("div", { className: "min-h-screen flex items-center justify-center" }, "Loading...");

  return h("div", { className: "min-h-screen bg-slate-100" },
    h("header", { className: "bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-10" },
      h("div", { className: "flex items-center gap-3" },
        h("span", { className: "text-[24px]" }, "📒"),
        h("div", null,
          h("div", { className: "text-[15px] font-black" }, companyName || "ULTRA LEDGER"),
          h("div", { className: "text-[11px] font-bold text-slate-500" }, "@" + profile?.username))),
      h("div", { className: "flex items-center gap-2" },
        h("span", { className: "text-[11px] font-bold px-2 py-1 rounded-full " + (status === "saving" ? "bg-amber-100 text-amber-700" : status === "saved" ? "bg-green-100 text-green-700" : status === "error" ? "bg-red-100 text-red-700" : "bg-slate-100 text-slate-500") },
          status === "saving" ? "☁️ Saving..." : status === "saved" ? "✓ Saved" : status === "error" ? "❌ Failed" : "☁️ Cloud"),
        h("button", { onClick: doLogout, className: "h-9 px-3 rounded-lg border font-black text-[12px]" }, "Logout"))),

    h("div", { className: "p-4" },
      h("div", { className: "bg-white rounded-xl border p-4 mb-4 flex flex-wrap gap-3 items-center" },
        h("label", { className: "text-[13px] font-bold" }, "Party:"),
        h("select", { value: selectedParty, onChange: e => { setSelectedParty(e.target.value); const alt = parties.find(p => p.id !== e.target.value); if (alt) setCounter(alt.id); },
          className: "h-10 rounded-lg border px-3 text-[13px] font-bold" },
          parties.map(p => h("option", { key: p.id, value: p.id }, p.id))),
        h("div", { className: "text-[18px] font-black " + (balance >= 0 ? "text-green-600" : "text-red-600") }, "Balance: ₹" + Number(balance).toLocaleString("en-IN"))),

      h("div", { className: "bg-white rounded-xl border overflow-hidden mb-4" },
        h("table", { className: "w-full text-[13px]" },
          h("thead", { className: "bg-slate-100" },
            h("tr", null,
              h("th", { className: "text-left p-2 text-[11px] font-black uppercase" }, "Date"),
              h("th", { className: "text-left p-2 text-[11px] font-black uppercase" }, "Counter"),
              h("th", { className: "text-left p-2 text-[11px] font-black uppercase" }, "Remark"),
              h("th", { className: "text-right p-2 text-[11px] font-black uppercase" }, "Debit"),
              h("th", { className: "text-right p-2 text-[11px] font-black uppercase" }, "Credit"),
              h("th", { className: "text-right p-2 text-[11px] font-black uppercase" }, "Balance"),
              h("th", { className: "text-left p-2 text-[11px] font-black uppercase" }, "Act"))),
          h("tbody", null,
            partyRows.length === 0 && h("tr", null, h("td", { colSpan: 7, className: "p-8 text-center text-slate-400" }, "No entries")),
            partyRows.map(e => {
              const bal = runningBalance.get(e.id) || 0;
              return h("tr", { key: e.id, className: "border-t" },
                h("td", { className: "p-2 font-mono text-[12px]" }, e.date + " " + e.time),
                h("td", { className: "p-2 font-bold" }, e.counterPartyId || "-"),
                h("td", { className: "p-2" }, e.remark || "-"),
                h("td", { className: "p-2 text-right font-mono text-red-600" }, e.amount < 0 ? "₹" + Math.abs(e.amount).toLocaleString("en-IN") : "-"),
                h("td", { className: "p-2 text-right font-mono text-green-600" }, e.amount > 0 ? "₹" + e.amount.toLocaleString("en-IN") : "-"),
                h("td", { className: "p-2 text-right font-mono font-black " + (bal < 0 ? "text-red-600" : "text-green-600") }, "₹" + bal.toLocaleString("en-IN")),
                h("td", { className: "p-2" },
                  h("button", { onClick: () => deleteEntry(e), className: "text-[10px] px-2 py-0.5 rounded bg-red-50 text-red-600 border border-red-200 font-bold" }, "Del")));
            }))),

      h("div", { className: "bg-white rounded-xl border p-4 flex gap-2 items-end" },
        h("div", { style: { flex: "0 0 20%" } },
          h("label", { className: "text-[10px] font-black uppercase" }, "Counter"),
          h("select", { value: counter, onChange: e => setCounter(e.target.value), className: "w-full h-10 rounded-lg border px-3 text-[13px] font-bold" },
            parties.filter(p => p.id !== selectedParty).map(p => h("option", { key: p.id, value: p.id }, p.id)))),
        h("div", { style: { flex: "0 0 20%" } },
          h("label", { className: "text-[10px] font-black uppercase" }, "Amount"),
          h("input", { value: amount, onChange: e => { if (/^[+\-\d.\s\/]*$/.test(e.target.value)) setAmount(e.target.value); },
            onKeyDown: e => { if (e.key === "Enter") document.getElementById("remarkInput")?.focus(); },
            placeholder: "100/200", className: "w-full h-10 rounded-lg border px-3 text-[14px] font-black" })),
        h("div", { style: { flex: "1" } },
          h("label", { className: "text-[10px] font-black uppercase" }, "Remark"),
          h("input", { id: "remarkInput", value: remark, onChange: e => setRemark(e.target.value),
            onKeyDown: e => { if (e.key === "Enter") addEntry(); },
            placeholder: "Pay...", className: "w-full h-10 rounded-lg border px-3" })),
        h("button", { onClick: addEntry, className: "h-10 px-5 rounded-lg bg-cyan-600 text-white font-black" }, "ADD"))));
}

function MainApp() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: prof } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
        if (prof) { setSession(session); setProfile(prof); }
      }
      setReady(true);
    })();
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      if (event === "SIGNED_OUT") { setSession(null); setProfile(null); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!ready) return h("div", { className: "min-h-screen flex items-center justify-center" }, "Loading...");
  if (!session) return h(LoginScreen, { onLogin: async (sess) => {
    const { data: prof } = await sb.from("profiles").select("*").eq("id", sess.user.id).single();
    setSession(sess); setProfile(prof);
  }});
  return h(LedgerApp, { session, profile, onLogout: () => sb.auth.signOut() });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(MainApp));
</script>
</body>
</html>
